name: ACORN HUNTER Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate game from archive into repository
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" ! -path "./.git/*" | head -n 1 || true)

          if [ -n "$ZIP" ]; then
            echo "Found game archive: $ZIP"
            unzip -t "$ZIP"
            rm -rf "$GITHUB_WORKSPACE/_game_extract"
            mkdir -p "$GITHUB_WORKSPACE/_game_extract"
            unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/_game_extract"

            PROJECT_FILE=$(find "$GITHUB_WORKSPACE/_game_extract" -type f -name "project.godot" | head -n 1)
            if [ -z "$PROJECT_FILE" ]; then
              echo "::error::project.godot not found inside archive"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$PROJECT_FILE")
            echo "Game project found at: $PROJECT_DIR"

            rsync -a --delete-excluded \
              --exclude='.git/' \
              --exclude='.github/' \
              "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"

            rm -f "$ZIP"
            rm -rf "$GITHUB_WORKSPACE/_game_extract"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "Repository already contains the extracted project."
            else
              git commit -m "Migrate ACORN HUNTER project from archive [skip ci]"
              git push origin HEAD:${GITHUB_REF_NAME}
              echo "Game project migrated into repository."
            fi
          else
            echo "No game archive found. Building project directly from repository."
          fi

      - name: Locate Godot project
        shell: bash
        run: |
          set -e
          PROJECT_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name "project.godot" ! -path "*/.git/*" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found in repository"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort | head -n 200
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "GODOT_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

      - name: Configure Android texture compression
        shell: bash
        run: |
          set -e
          PROJECT_FILE="$GODOT_PROJECT_DIR/project.godot"
          python3 - "$PROJECT_FILE" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          setting = "textures/vram_compression/import_etc2_astc=true"
          if setting not in text:
              lines = text.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if line.strip() == "[rendering]":
                      lines.insert(i + 1, setting + "\n")
                      text = "".join(lines)
                      break
              else:
                  text = text.rstrip() + "\n\n[rendering]\n" + setting + "\n"
              path.write_text(text, encoding="utf-8")
          PY
          grep -n "import_etc2_astc" "$PROJECT_FILE"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -e
          VERSION="4.7.2"
          mkdir -p "$GITHUB_WORKSPACE/godot"
          wget -q --show-progress "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -O "$GITHUB_WORKSPACE/godot.zip"
          unzip -q "$GITHUB_WORKSPACE/godot.zip" -d "$GITHUB_WORKSPACE/godot"
          GODOT_BIN=$(find "$GITHUB_WORKSPACE/godot" -type f -name "Godot_v${VERSION}-stable_linux.x86_64" | head -n 1)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install Godot export templates
        shell: bash
        run: |
          set -e
          VERSION="4.7.2"
          TPZ="$GITHUB_WORKSPACE/templates.tpz"
          DEST="$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          rm -f "$TPZ"
          wget -q --show-progress "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz" -O "$TPZ"
          test -s "$TPZ"
          TMP="$GITHUB_WORKSPACE/templates"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$TPZ" -d "$TMP"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r "$TMP/templates/"* "$DEST/"
          test -f "$DEST/version.txt"

      - name: Prepare Godot project
        shell: bash
        run: |
          set -e
          cd "$GODOT_PROJECT_DIR"
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd "$GODOT_PROJECT_DIR"
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$GODOT_BIN" --headless --path . --export-debug "Android" "$GITHUB_WORKSPACE/build/ACORN_HUNTER.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="$GITHUB_WORKSPACE/build/ACORN_HUNTER.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACORN_HUNTER-Android
          path: build/ACORN_HUNTER.apk
          if-no-files-found: error
