name: Build Godot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Find ZIP
      # -----------------------------

      - name: Find game ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Game ZIP not found"
            exit 1
          fi

          echo "Found game archive: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # Extract Godot project
      # -----------------------------

      - name: Extract Godot project
        run: |
          rm -rf godot_project
          mkdir godot_project

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d godot_project

          echo "Archive extracted."

      # -----------------------------
      # Locate project.godot
      # -----------------------------

      - name: Locate Godot project
        id: locate_project
        shell: bash
        run: |
          PROJECT_FILE=$(find godot_project -name "project.godot" -type f | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found inside ZIP"
            echo "Archive contents:"
            find godot_project -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Godot project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # Java
      # -----------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # -----------------------------
      # Android SDK
      # -----------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # -----------------------------
      # Android SDK packages
      # -----------------------------

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      # -----------------------------
      # Download Godot
      # -----------------------------

      - name: Download Godot
        shell: bash
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          chmod +x Godot_v4.7.2-stable_linux.x86_64

      # -----------------------------
      # Verify project
      # -----------------------------

      - name: Verify Godot project
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          "$GITHUB_WORKSPACE/Godot_v4.7.2-stable_linux.x86_64" \
            --headless \
            --path . \
            --editor \
            --quit

      # -----------------------------
      # Build APK
      # -----------------------------

      - name: Build APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          mkdir -p build

          "$GITHUB_WORKSPACE/Godot_v4.7.2-stable_linux.x86_64" \
            --headless \
            --path . \
            --export-debug "Android" \
            build/AcornHunter-Carolina.apk

      # -----------------------------
      # Upload APK
      # -----------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AcornHunter-Carolina-APK
          path: ${{ steps.locate_project.outputs.project_dir }}/build/AcornHunter-Carolina.apk
          if-no-files-found: error
