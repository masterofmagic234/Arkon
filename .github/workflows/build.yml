name: ACORN HUNTER Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find game ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" ! -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP archive found in repository"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "Found ZIP: $ZIP"
          cp "$ZIP" "$GITHUB_WORKSPACE/game.zip"
          echo "GAME_ZIP=$GITHUB_WORKSPACE/game.zip" >> "$GITHUB_ENV"
          ls -lh "$GITHUB_WORKSPACE/game.zip"

      - name: Verify game ZIP
        shell: bash
        run: |
          set -e
          unzip -t "$GAME_ZIP"

      - name: Extract Godot project
        shell: bash
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/godot_project"
          mkdir -p "$GITHUB_WORKSPACE/godot_project"
          unzip -q "$GAME_ZIP" -d "$GITHUB_WORKSPACE/godot_project"

      - name: Locate Godot project
        shell: bash
        run: |
          set -e
          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/godot_project" -type f -name "project.godot" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "GODOT_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

      - name: Configure Android texture compression
        shell: bash
        run: |
          set -e
          PROJECT_FILE="$GODOT_PROJECT_DIR/project.godot"
          python3 - "$PROJECT_FILE" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          setting = "textures/vram_compression/import_etc2_astc=true"
          if setting not in text:
              lines = text.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if line.strip() == "[rendering]":
                      lines.insert(i + 1, setting + "\n")
                      text = "".join(lines)
                      break
              else:
                  text = text.rstrip() + "\n\n[rendering]\n" + setting + "\n"
              path.write_text(text, encoding="utf-8")
          PY
          grep -n "import_etc2_astc" "$PROJECT_FILE"

      - name: Fix illustrated wall materials
        shell: bash
        run: |
          set -e
          SCENE=$(find "$GODOT_PROJECT_DIR" -type f -name "game.tscn" | head -n 1)
          if [ -z "$SCENE" ]; then
            echo "::error::game.tscn not found"
            exit 1
          fi

          python3 - "$SCENE" <<'PY'
          import sys, re
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          texture_ids = [(f"hedge_wall_0{i}.png", f"{20+i}_wall") for i in range(1, 7)]
          missing = [name for name, _ in texture_ids if not (path.parent / "assets" / name).exists()]
          if missing:
              print("Illustrated wall assets missing; leaving scene unchanged:", missing)
              raise SystemExit(0)

          if 'id="21_wall"' not in text:
              marker = '[ext_resource type="Texture2D" path="res://assets/weapon.png" id="10_weapon"]'
              resources = []
              for name, rid in texture_ids:
                  resources.append(f'[ext_resource type="Texture2D" path="res://assets/{name}" id="{rid}"]')
              if marker not in text:
                  raise SystemExit("Expected weapon ext_resource marker not found")
              text = text.replace(marker, "\n".join(resources) + "\n" + marker, 1)

          if 'id="WallMat_1"' not in text:
              marker = '[sub_resource type="BoxShape3D" id="WallShape"]\n'
              resources = []
              for i in range(1, 7):
                  resources.append(f'[sub_resource type="StandardMaterial3D" id="WallMat_{i}"]')
                  resources.append('shading_mode = 0')
                  resources.append('cull_mode = 2')
                  resources.append('albedo_color = Color(0.72, 0.82, 0.76, 1)')
                  resources.append(f'albedo_texture = ExtResource("{20+i}_wall")')
                  resources.append('roughness = 1.0')
                  resources.append('')
                  resources.append(f'[sub_resource type="BoxMesh" id="WallMesh_{i}"]')
                  resources.append(f'material = SubResource("WallMat_{i}")')
                  resources.append('size = Vector3(1.8, 2.6, 1.8)')
                  resources.append('')
              if marker not in text:
                  raise SystemExit("WallShape marker not found")
              text = text.replace(marker, marker + "\n".join(resources) + "\n", 1)

          pattern = [1, 4, 4, 2, 5, 2, 3, 6]
          wall_re = re.compile(r'(?ms)^\[node name="(MapWall_\d{3})" type="StaticBody3D"\].*?(?=^\[node |\Z)')
          matches = list(wall_re.finditer(text))
          if not matches:
              raise SystemExit("No MapWall_* nodes found")

          out = []
          last = 0
          changed = 0
          for idx, m in enumerate(matches):
              block = m.group(0)
              mat = pattern[idx % len(pattern)]
              block = re.sub(r'(?m)^mesh = SubResource\("WallMesh(?:_\d+)?"\)$', f'mesh = SubResource("WallMesh_{mat}")', block, count=1)
              block = re.sub(r'(?m)^material_override = SubResource\("WallMat_\d+"\)$\n?', '', block, count=1)
              if f'mesh = SubResource("WallMesh_{mat}")' in block:
                  block = block.replace(f'mesh = SubResource("WallMesh_{mat}")', f'mesh = SubResource("WallMesh_{mat}")\nmaterial_override = SubResource("WallMat_{mat}")', 1)
                  changed += 1
              out.append(text[last:m.start()])
              out.append(block)
              last = m.end()
          out.append(text[last:])
          text = ''.join(out)
          path.write_text(text, encoding="utf-8")
          print(f"Illustrated wall materials patched on {changed}/{len(matches)} MapWall nodes.")
          PY

          echo "Wall material assignments:"
          grep -n "material_override = SubResource(\"WallMat_" "$SCENE" | head -n 40

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -e
          VERSION="4.7.2"
          mkdir -p "$GITHUB_WORKSPACE/godot"
          wget -q --show-progress "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -O "$GITHUB_WORKSPACE/godot.zip"
          unzip -q "$GITHUB_WORKSPACE/godot.zip" -d "$GITHUB_WORKSPACE/godot"
          GODOT_BIN=$(find "$GITHUB_WORKSPACE/godot" -type f -name "Godot_v${VERSION}-stable_linux.x86_64" | head -n 1)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install Godot export templates
        shell: bash
        run: |
          set -e
          VERSION="4.7.2"
          TPZ="$GITHUB_WORKSPACE/templates.tpz"
          DEST="$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          rm -f "$TPZ"
          wget -q --show-progress "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz" -O "$TPZ"
          test -s "$TPZ"
          TMP="$GITHUB_WORKSPACE/templates"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          unzip -q "$TPZ" -d "$TMP"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r "$TMP/templates/"* "$DEST/"
          test -f "$DEST/version.txt"

      - name: Prepare Godot project
        shell: bash
        run: |
          set -e
          cd "$GODOT_PROJECT_DIR"
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd "$GODOT_PROJECT_DIR"
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$GODOT_BIN" --headless --path . --export-debug "Android" "$GITHUB_WORKSPACE/build/ACORN_HUNTER_V23.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="$GITHUB_WORKSPACE/build/ACORN_HUNTER_V23.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACORN_HUNTER_V23-Android
          path: build/ACORN_HUNTER_V23.apk
          if-no-files-found: error
