name: Build Acorn Hunter v7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          echo "ZIP: $ZIP_FILE"
          test -n "$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          mkdir -p game
          unzip -q "$ZIP_FILE" -d game
          echo "Extracted:"
          find game -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          SETTINGS=$(find game -type f -name 'settings.gradle' -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find game -type f -name 'settings.gradle.kts' -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            find game -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AcornHunter-Carolina-v7-APK
          path: '**/build/outputs/apk/debug/*.apk'
