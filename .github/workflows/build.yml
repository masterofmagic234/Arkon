name: Build Godot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==============================
      # FIND ZIP
      # ==============================

      - name: Find game ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Game ZIP not found"
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"


      # ==============================
      # EXTRACT
      # ==============================

      - name: Extract Godot project
        run: |
          rm -rf godot_project
          mkdir godot_project

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d godot_project

          echo "Archive extracted."


      # ==============================
      # FIND PROJECT
      # ==============================

      - name: Locate Godot project
        id: locate_project
        shell: bash
        run: |
          PROJECT_FILE=$(find godot_project \
            -name "project.godot" \
            -type f | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Godot project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ==============================
      # JAVA
      # ==============================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==============================
      # ANDROID SDK
      # ==============================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""


      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true


      # ==============================
      # GODOT
      # ==============================

      - name: Download Godot
        shell: bash
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          chmod +x Godot_v4.7.2-stable_linux.x86_64

          ./Godot_v4.7.2-stable_linux.x86_64 --version


      # ==============================
      # GODOT EXPORT TEMPLATES
      # ==============================

      - name: Install Godot Android export templates
        shell: bash
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -O templates.tpz

          TEMP_DIR="$RUNNER_TEMP/godot_templates"

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          unzip -q templates.tpz -d "$TEMP_DIR"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"

          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"

          find "$TEMP_DIR" -type f -exec cp {} "$TEMPLATE_DIR/" \;

          echo "Export templates:"
          ls -lh "$TEMPLATE_DIR"


      # ==============================
      # PATCH GODOT PROJECT
      # ==============================

      - name: Prepare Godot Android project
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |

          echo "=== Removing invalid audio bus ==="

          rm -f default_bus_layout.tres


          echo "=== Enabling ETC2/ASTC ==="

          python3 <<'PY'
          from pathlib import Path

          p = Path("project.godot")
          text = p.read_text(encoding="utf-8")

          key = "textures/vram_compression/import_etc2_astc=true"

          if key not in text:
              lines = text.splitlines()

              inserted = False
              result = []

              for line in lines:
                  result.append(line)

                  if line.strip() == "[rendering]":
                      result.append(key)
                      inserted = True

              if not inserted:
                  result.append("")
                  result.append("[rendering]")
                  result.append(key)

              text = "\n".join(result) + "\n"

          p.write_text(text, encoding="utf-8")
          PY


          echo "=== Repairing export_presets.cfg ==="

          if [ -f export_presets.cfg ]; then

            python3 <<'PY'
          from pathlib import Path

          p = Path("export_presets.cfg")
          text = p.read_text(encoding="utf-8")

          required = {
              'export_filter="all_resources"': 'export_filter="all_resources"',
              'include_filter=""': 'include_filter=""',
              'exclude_filter=""': 'exclude_filter=""',
          }

          lines = text.splitlines()
          result = []

          in_preset = False
          seen = set()

          for line in lines:

              if line.startswith("[preset.") and not line.startswith("[preset.") is False:
                  in_preset = True
                  seen = set()

              if in_preset and line.startswith("export_filter="):
                  seen.add("export_filter")

              if in_preset and line.startswith("include_filter="):
                  seen.add("include_filter")

              if in_preset and line.startswith("exclude_filter="):
                  seen.add("exclude_filter")

              result.append(line)

          text = "\n".join(result) + "\n"

          # If preset.0 exists but fields are missing,
          # insert them immediately after [preset.0].
          if "[preset.0]" in text:
              section_start = text.find("[preset.0]")
              section_end = text.find("\n[", section_start + 1)

              if section_end == -1:
                  section_end = len(text)

              section = text[section_start:section_end]

              additions = []

              if 'export_filter=' not in section:
                  additions.append('export_filter="all_resources"')

              if 'include_filter=' not in section:
                  additions.append('include_filter=""')

              if 'exclude_filter=' not in section:
                  additions.append('exclude_filter=""')

              if additions:
                  marker = "[preset.0]\n"
                  replacement = marker + "\n".join(additions) + "\n"

                  text = text.replace(marker, replacement, 1)

          p.write_text(text, encoding="utf-8")
          PY

          else

            cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/AcornHunter-Carolina.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.danil.acornhunter"
          package/name="Acorn Hunter Carolina"
          package/signed=false
          EOF

          fi


          echo "=== project.godot ETC2 check ==="
          grep -n "import_etc2_astc" project.godot || true

          echo "=== export_presets.cfg ==="
          sed -n '1,80p' export_presets.cfg


      # ==============================
      # VERIFY
      # ==============================

      - name: Verify Godot project
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          "$GITHUB_WORKSPACE/Godot_v4.7.2-stable_linux.x86_64" \
            --headless \
            --path . \
            --editor \
            --quit


      # ==============================
      # BUILD
      # ==============================

      - name: Build Android APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          mkdir -p build

          "$GITHUB_WORKSPACE/Godot_v4.7.2-stable_linux.x86_64" \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/AcornHunter-Carolina.apk


      # ==============================
      # UPLOAD
      # ==============================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AcornHunter-Carolina-Godot
          path: ${{ steps.locate_project.outputs.project_dir }}/build/AcornHunter-Carolina.apk
          if-no-files-found: error
