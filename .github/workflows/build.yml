name: ACORN HUNTER Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Find V22 ZIP
      # --------------------------------------------------

      - name: Find game ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::No ZIP archive found in repository"
            echo "Available files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          cp "$ZIP" "$GITHUB_WORKSPACE/game.zip"

          echo "GAME_ZIP=$GITHUB_WORKSPACE/game.zip" >> "$GITHUB_ENV"

          echo "Archive size:"
          ls -lh "$GITHUB_WORKSPACE/game.zip"
      # --------------------------------------------------
      # Verify ZIP
      # --------------------------------------------------

      - name: Verify game ZIP
        shell: bash
        run: |
          set -e

          echo "Testing ZIP integrity..."

          unzip -t "$GAME_ZIP"

          echo "ZIP integrity OK."

      # --------------------------------------------------
      # Extract project
      # --------------------------------------------------

      - name: Extract Godot project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/godot_project"

          mkdir -p "$GITHUB_WORKSPACE/godot_project"

          unzip -q \
            "$GAME_ZIP" \
            -d "$GITHUB_WORKSPACE/godot_project"

      # --------------------------------------------------
      # Locate project.godot
      # --------------------------------------------------

      - name: Locate Godot project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find \
            "$GITHUB_WORKSPACE/godot_project" \
            -type f \
            -name "project.godot" \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found"

            find \
              "$GITHUB_WORKSPACE/godot_project" \
              -maxdepth 5 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Godot project:"
          echo "$PROJECT_DIR"

          echo "GODOT_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # Java
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # Android SDK
      # --------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo
          echo "Installed Android SDK packages:"
          sdkmanager --list_installed

      # --------------------------------------------------
      # Godot
      # --------------------------------------------------

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -e

          VERSION="4.7.2"

          mkdir -p "$GITHUB_WORKSPACE/godot"

          wget -q --show-progress \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" \
            -O "$GITHUB_WORKSPACE/godot.zip"

          unzip -q \
            "$GITHUB_WORKSPACE/godot.zip" \
            -d "$GITHUB_WORKSPACE/godot"

          GODOT_BIN=$(find \
            "$GITHUB_WORKSPACE/godot" \
            -type f \
            -name "Godot_v${VERSION}-stable_linux.x86_64" \
            | head -n 1)

          if [ -z "$GODOT_BIN" ]; then
            echo "::error::Godot executable not found"
            exit 1
          fi

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      # --------------------------------------------------
      # Export templates
      # --------------------------------------------------
            - name: Install Godot export templates
        shell: bash
        run: |
          set -e

          VERSION="4.7.2"
          TPZ="$GITHUB_WORKSPACE/templates.tpz"
          DEST="$HOME/.local/share/godot/export_templates/${VERSION}.stable"

          echo "Downloading Godot export templates..."

          rm -f "$TPZ"

          wget -q --show-progress \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz" \
            -O "$TPZ"

          echo "Downloaded:"
          ls -lh "$TPZ"
          test -s "$TPZ"

          echo "Extracting templates..."

          TMP="$GITHUB_WORKSPACE/templates"
          rm -rf "$TMP"
          mkdir -p "$TMP"

          unzip -q "$TPZ" -d "$TMP"

          echo "Creating template directory..."

          rm -rf "$DEST"
          mkdir -p "$DEST"

          echo "Installing templates..."

          cp -r "$TMP/templates/"* "$DEST/"

          echo "Installed templates:"
          ls -lh "$DEST"

          test -f "$DEST/version.txt"

          echo "Godot export templates installed successfully."
      # --------------------------------------------------
      # Prepare
      # --------------------------------------------------

      - name: Prepare Godot project
        shell: bash
        run: |
          set -e

          cd "$GODOT_PROJECT_DIR"

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path . \
            --quit

      # --------------------------------------------------
      # Build APK
      # --------------------------------------------------

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$GODOT_PROJECT_DIR"

          mkdir -p "$GITHUB_WORKSPACE/build"

          "$GODOT_BIN" \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/ACORN_HUNTER_V22.apk"

      # --------------------------------------------------
      # Verify APK
      # --------------------------------------------------

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/build/ACORN_HUNTER_V22.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not created"
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACORN_HUNTER_V22-Android
          path: build/ACORN_HUNTER_V22.apk
          if-no-files-found: error
