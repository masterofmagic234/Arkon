name: Build Godot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # FIND ZIP
      # ==========================================

      - name: Find game ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Game ZIP not found"
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"


      # ==========================================
      # EXTRACT GODOT PROJECT
      # ==========================================

      - name: Extract Godot project
        run: |
          rm -rf godot_project
          mkdir -p godot_project

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d godot_project

          echo "Archive extracted."


      # ==========================================
      # FIND project.godot
      # ==========================================

      - name: Locate Godot project
        id: locate_project
        shell: bash
        run: |
          PROJECT_FILE=$(find godot_project \
            -name "project.godot" \
            -type f | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Godot project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""


      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true


      # ==========================================
      # GODOT
      # ==========================================

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          chmod +x Godot_v4.7.2-stable_linux.x86_64

          ./Godot_v4.7.2-stable_linux.x86_64 --version


      # ==========================================
      # GODOT EXPORT TEMPLATES
      # ==========================================

      - name: Install Godot Android export templates
        shell: bash
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -O templates.tpz

          TEMP_DIR="$RUNNER_TEMP/godot_templates"

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          unzip -q templates.tpz -d "$TEMP_DIR"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"

          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"

          find "$TEMP_DIR" -type f -exec cp {} "$TEMPLATE_DIR/" \;

          echo "Templates installed:"
          ls -lh "$TEMPLATE_DIR"


      # ==========================================
      # PATCH PROJECT
      # ==========================================

      - name: Prepare Godot project
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |

          # Remove invalid audio bus resource
          rm -f default_bus_layout.tres


          # Enable ETC2 / ASTC
          python3 <<'PY'
          from pathlib import Path

          p = Path("project.godot")
          text = p.read_text(encoding="utf-8")

          key = "textures/vram_compression/import_etc2_astc=true"

          if key not in text:
              lines = text.splitlines()
              result = []
              inserted = False

              for line in lines:
                  result.append(line)

                  if line.strip() == "[rendering]":
                      result.append(key)
                      inserted = True

              if not inserted:
                  result.append("")
                  result.append("[rendering]")
                  result.append(key)

              text = "\n".join(result) + "\n"

          p.write_text(text, encoding="utf-8")
          PY


          # Make sure Android APK is signed
          python3 <<'PY'
          from pathlib import Path

          p = Path("export_presets.cfg")
          text = p.read_text(encoding="utf-8")

          text = text.replace(
              'package/signed=false',
              'package/signed=true'
          )

          p.write_text(text, encoding="utf-8")
          PY


          echo "Android signing enabled."

          grep -n "package/signed" export_presets.cfg


      # ==========================================
      # GENERATE TEMPORARY DEBUG KEYSTORE
      # ==========================================

      - name: Generate Android debug keystore
        shell: bash
        run: |

          keytool \
            -keyalg RSA \
            -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 \
            -deststoretype pkcs12

          echo "Debug keystore created."

          keytool \
            -list \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android


      # ==========================================
      # VERIFY PROJECT
      # ==========================================

      - name: Verify Godot project
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          "$GITHUB_WORKSPACE/Godot_v4.7.2-stable_linux.x86_64" \
            --headless \
            --path . \
            --editor \
            --quit


      # ==========================================
      # BUILD SIGNED APK
      # ==========================================

      - name: Build signed Android APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |

          mkdir -p build

          "$GITHUB_WORKSPACE/Godot_v4.7.2-stable_linux.x86_64" \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/AcornHunter-Carolina.apk


      # ==========================================
      # VERIFY APK SIGNATURE
      # ==========================================

      - name: Verify APK signature
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            build/AcornHunter-Carolina.apk


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AcornHunter-Carolina-Godot-SIGNED
          path: ${{ steps.locate_project.outputs.project_dir }}/build/AcornHunter-Carolina.apk
          if-no-files-found: error
