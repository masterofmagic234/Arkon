name: ACORN HUNTER Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find game ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f \
            \( -iname "ACORN_HUNTER_V22_ILLUSTRATED_WALLS.zip" \
            -o -iname "*V22*ILLUSTRATED*WALLS*.zip" \
            \) | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::V22 ZIP not found"
            exit 1
          fi

          cp "$ZIP" game.zip

          echo "GAME_ZIP=$GITHUB_WORKSPACE/game.zip" >> "$GITHUB_ENV"

          ls -lh game.zip

      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          echo "Checking ZIP integrity..."
          unzip -t "$GAME_ZIP"

          echo "ZIP OK"

      - name: Extract Godot project
        shell: bash
        run: |
          set -e

          rm -rf godot_project
          mkdir -p godot_project

          unzip -q "$GAME_ZIP" -d godot_project

      - name: Locate Godot project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find godot_project \
            -type f \
            -name "project.godot" \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found"
            find godot_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "GODOT_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot project:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -e

          VERSION="4.7.2"

          wget -q --show-progress \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip -d godot

          GODOT_BIN=$(find godot \
            -type f \
            -name "Godot_v${VERSION}-stable_linux.x86_64" \
            | head -n 1)

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Prepare Godot project
        shell: bash
        run: |
          set -e

          cd "$GODOT_PROJECT_DIR"

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$GODOT_PROJECT_DIR"

          mkdir -p "$GITHUB_WORKSPACE/build"

          "$GODOT_BIN" \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/ACORN_HUNTER_V22.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -f build/ACORN_HUNTER_V22.apk

          ls -lh build/ACORN_HUNTER_V22.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACORN_HUNTER_V22-Android
          path: build/ACORN_HUNTER_V22.apk
          if-no-files-found: error
