name: Build Godot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # FIND ZIP
      # ==========================================

      - name: Find game ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Game ZIP not found"
            exit 1
          fi

          echo "Game archive: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"


      # ==========================================
      # EXTRACT PROJECT
      # ==========================================

      - name: Extract Godot project
        run: |
          rm -rf godot_project
          mkdir -p godot_project

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d godot_project

          echo "Project extracted."


      # ==========================================
      # FIND project.godot
      # ==========================================

      - name: Locate Godot project
        id: locate_project
        shell: bash
        run: |
          PROJECT_FILE=$(find godot_project \
            -name "project.godot" \
            -type f | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            find godot_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Godot project found at:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""


      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true


      # ==========================================
      # GODOT
      # ==========================================

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip

          chmod +x Godot_v4.7.2-stable_linux.x86_64

          ./Godot_v4.7.2-stable_linux.x86_64 --version


      # ==========================================
      # GODOT EXPORT TEMPLATES
      # ==========================================

      - name: Install Godot Android export templates
        shell: bash
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -O templates.tpz

          TEMP_DIR="$RUNNER_TEMP/godot_templates"

          rm -rf "$TEMP_DIR"

          mkdir -p "$TEMP_DIR"

          unzip -q templates.tpz -d "$TEMP_DIR"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"

          rm -rf "$TEMPLATE_DIR"

          mkdir -p "$TEMPLATE_DIR"

          find "$TEMP_DIR" -type f -exec cp {} "$TEMPLATE_DIR/" \;

          echo "Installed Godot export templates:"
          ls -lh "$TEMPLATE_DIR"


      # ==========================================
      # PATCH PROJECT
      # ==========================================

      - name: Remove invalid audio bus layout
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "Removing invalid default_bus_layout.tres..."

          rm -f default_bus_layout.tres

          python3 - <<'PY'
          from pathlib import Path

          p = Path("project.godot")
          text = p.read_text(encoding="utf-8")

          lines = text.splitlines()

          result = []
          skip_audio = False

          for line in lines:
              if line.strip() == "[audio]":
                  skip_audio = True
                  continue

              if skip_audio:
                  if line.startswith("[") and line.endswith("]"):
                      skip_audio = False
                      result.append(line)
                  else:
                      continue
              else:
                  result.append(line)

          p.write_text("\n".join(result) + "\n", encoding="utf-8")
          PY

          echo "Audio bus reference removed."


      # ==========================================
      # IMPORT / VERIFY
      # ==========================================

      - name: Verify Godot project
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          "$GITHUB_WORKSPACE/Godot_v4.7.2-stable_linux.x86_64" \
            --headless \
            --path . \
            --editor \
            --quit


      # ==========================================
      # EXPORT APK
      # ==========================================

      - name: Build Android APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          mkdir -p build

          "$GITHUB_WORKSPACE/Godot_v4.7.2-stable_linux.x86_64" \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/AcornHunter-Carolina.apk


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AcornHunter-Carolina-Godot
          path: ${{ steps.locate_project.outputs.project_dir }}/build/AcornHunter-Carolina.apk
          if-no-files-found: error
