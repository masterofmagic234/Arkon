name: ACORN HUNTER Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild V22 ZIP from parts
        shell: bash
        run: |
          set -e

          mkdir -p zip_parts

          echo "Looking for V22 archive parts..."

          find . -type f \
            -name "ACORN_HUNTER_V22_ILLUSTRATED_WALLS.zip.part*.zip" \
            -print | sort

          for i in 00 01 02 03; do
            FILE=$(find . -type f \
              -name "ACORN_HUNTER_V22_ILLUSTRATED_WALLS.zip.part${i}.zip" \
              | head -n 1)

            if [ -z "$FILE" ]; then
              echo "::error::Missing V22 part ${i}"
              exit 1
            fi

            echo "Found part ${i}: $FILE"

            unzip -q "$FILE" -d "zip_parts/part${i}"
          done

          cat \
            zip_parts/part00/ACORN_HUNTER_V22_ILLUSTRATED_WALLS.zip.part00 \
            zip_parts/part01/ACORN_HUNTER_V22_ILLUSTRATED_WALLS.zip.part01 \
            zip_parts/part02/ACORN_HUNTER_V22_ILLUSTRATED_WALLS.zip.part02 \
            zip_parts/part03/ACORN_HUNTER_V22_ILLUSTRATED_WALLS.zip.part03 \
            > ACORN_HUNTER_V22_ILLUSTRATED_WALLS.zip

          echo "Reconstructed ZIP:"
          ls -lh ACORN_HUNTER_V22_ILLUSTRATED_WALLS.zip

      - name: Verify reconstructed ZIP
        shell: bash
        run: |
          set -e

          echo "Testing ZIP integrity..."

          unzip -t ACORN_HUNTER_V22_ILLUSTRATED_WALLS.zip

          echo "ZIP integrity: OK"

      - name: Extract Godot project
        shell: bash
        run: |
          set -e

          rm -rf godot_project
          mkdir -p godot_project

          unzip -q \
            ACORN_HUNTER_V22_ILLUSTRATED_WALLS.zip \
            -d godot_project

      - name: Locate Godot project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find godot_project \
            -type f \
            -name "project.godot" \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::project.godot not found"
            find godot_project -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Found project:"
          echo "$PROJECT_FILE"

          echo "GODOT_PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -e

          VERSION="4.7.2"

          wget -q --show-progress \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" \
            -O godot.zip

          unzip -q godot.zip -d godot

          GODOT_BIN=$(find godot -type f \
            -name "Godot_v${VERSION}-stable_linux.x86_64" \
            | head -n 1)

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Prepare Godot project
        shell: bash
        run: |
          set -e

          cd "$GODOT_PROJECT_DIR"

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          cd "$GODOT_PROJECT_DIR"

          mkdir -p "$GITHUB_WORKSPACE/build"

          "$GODOT_BIN" \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            "$GITHUB_WORKSPACE/build/ACORN_HUNTER_V22.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -f build/ACORN_HUNTER_V22.apk

          ls -lh build/ACORN_HUNTER_V22.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACORN_HUNTER_V22-Android
          path: build/ACORN_HUNTER_V22.apk
          if-no-files-found: error
