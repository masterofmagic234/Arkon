name: Restore modular wall materials
on:
  push:
    paths:
      - '.github/workflows/restore_modular_walls.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original modular mural assets and scene wiring
        shell: bash
        run: |
          set -euo pipefail
          git checkout c045eb378fd8673ac3ac1680656c92d7faa04e6c -- \
            assets/wall_mural_mossy_stone.png \
            assets/wall_mural_overgrown.png \
            assets/wall_mural_brick_stone.png \
            assets/wall_mural_wooden_fence.png \
            assets/wall_mural_ruined_temple.png \
            assets/wall_mural_autumn.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game.tscn')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'res://assets/wall_new_01_mossy_stone.png\" id=\"mural_1': 'res://assets/wall_mural_mossy_stone.png\" id=\"mural_1',
            'res://assets/wall_new_02_overgrown.png\" id=\"mural_2': 'res://assets/wall_mural_overgrown.png\" id=\"mural_2',
            'res://assets/wall_new_03_brick_stone.png\" id=\"mural_3': 'res://assets/wall_mural_brick_stone.png\" id=\"mural_3',
            'res://assets/wall_new_04_wooden_fence.png\" id=\"mural_4': 'res://assets/wall_mural_wooden_fence.png\" id=\"mural_4',
            'res://assets/wall_new_05_ruined_temple.png\" id=\"mural_5': 'res://assets/wall_mural_ruined_temple.png\" id=\"mural_5',
            'res://assets/wall_new_06_autumn.png\" id=\"mural_6': 'res://assets/wall_mural_autumn.png\" id=\"mural_6',
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.tscn assets/wall_mural_*.png
          git commit -m 'Restore modular wall rendering after texture replacement'
          git push
