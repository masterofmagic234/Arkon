name: Import ghost room artwork

on:
  push:
    paths:
      - '.github/workflows/import-ghost-room.yml'

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download edited artwork
        run: |
          set -e
          curl -L --fail --retry 3 -o 'a_cozy_highly_detailed_anime_style_night_bedroom (3).png' 'https://at.adobe.com/8f9kQveO69npDSQQ'
          file 'a_cozy_highly_detailed_anime_style_night_bedroom (3).png'
          test -s 'a_cozy_highly_detailed_anime_style_night_bedroom (3).png'

      - name: Commit artwork
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'a_cozy_highly_detailed_anime_style_night_bedroom (3).png'
          git commit -m 'Add ghost garland room artwork [skip ci]'
          git push
