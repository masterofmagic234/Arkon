name: ACORN HUNTER — Windows Build

on:
  push:
    branches: [main, "fix/**"]
    paths:
      - .github/workflows/windows_build.yml
      - export_presets.cfg
      - project.godot
      - scripts/**
      - shaders/**
      - scenes/**
      - assets/**
      - menu.tscn
      - intro_cutscene.tscn
      - tools/windows157/**
      - tools/verify_windows_package157.py
      - tools/desktop_controls157_test.gd
      - tools/desktop_graphics157_test.gd
      - tools/prepare_intro_videos.py
      - tools/prepare_park_escape_video.py
      - docs/windows.md
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_android_media:
        description: "Also build the focused1.58 Android APK from this exact source"
        type: boolean
        default: false
      android_media_only:
        description: "Build only the focused Android APK; keep existing Windows validation running"
        type: boolean
        default: false
      artifact_id:
        description: "Existing portable artifact ID; leave empty to export a new build"
        type: string
        default: ""
      source_sha:
        description: "Original artifact source SHA (required when reusing)"
        type: string
        default: ""
      source_tree:
        description: "Original artifact source tree (required when reusing)"
        type: string
        default: ""
      checkout_sha:
        description: "Original artifact checkout SHA (required when reusing)"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}${{ inputs.android_media_only && '-android' || '' }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  android-media:
    if: github.event_name == 'workflow_dispatch' && inputs.include_android_media && (inputs.android_media_only || inputs.artifact_id == '')
    uses: ./.github/workflows/media_release158.yml

  export-windows:
    if: ${{ !inputs.android_media_only && (github.event_name != 'workflow_dispatch' || inputs.artifact_id == '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      source-tree: ${{ steps.source.outputs.tree }}
      checkout-sha: ${{ steps.source.outputs.checkout }}
    steps:
      - name: Checkout exact build source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Godot and official export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Record source and validate the Windows preset
        id: source
        run: |
          set -euo pipefail
          checkout="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          test "$tree" = "$(git rev-parse "$SOURCE_SHA^{tree}")"
          echo "checkout=$checkout" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import pathlib
          text=pathlib.Path('export_presets.cfg').read_text()
          assert 'name="Windows Desktop"' in text and 'binary_format/architecture="x86_64"' in text
          assert 'version/name="1.58"' in text
          assert 'config/version="1.58"' in pathlib.Path('project.godot').read_text()
          assert 'renderer/rendering_method="gl_compatibility"' in pathlib.Path('project.godot').read_text()
          print('WINDOWS157 SOURCE: PASS')
          PY
      - name: Prepare the reviewed opening and park films
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout --kill-after=10s 120s sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=30 update -qq
            timeout --kill-after=10s 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o DPkg::Lock::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          python3 tools/prepare_intro_videos.py
          python3 tools/prepare_park_escape_video.py
          python3 tools/check_media158_assets.py
      - name: Import the actual game resources
        run: |
          set -euo pipefail
          timeout --kill-after=5s 420s godot --headless --path . --editor --quit 2>&1 | tee import-windows.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Cannot open file|ERROR:' import-windows.log; then exit 1; fi
      - name: Export Windows x64 Compatibility release
        run: |
          set -euo pipefail
          mkdir -p build/windows/AcornHunter
          timeout --kill-after=5s 420s godot --headless --path . --export-release "Windows Desktop" build/windows/AcornHunter/AcornHunter.exe 2>&1 | tee export-windows.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Cannot open file|ERROR:' export-windows.log; then exit 1; fi
          cp tools/windows157/README.txt build/windows/AcornHunter/README.txt
          curl --fail --location --retry 2 --max-time 60 https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/LICENSE.txt --output build/windows/AcornHunter/LICENSE.txt
          curl --fail --location --retry 2 --max-time 60 https://raw.githubusercontent.com/godotengine/godot/4.7.2-stable/COPYRIGHT.txt --output build/windows/AcornHunter/COPYRIGHT.txt
      - name: Validate focused1.58 media behavior before packaging
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/media158-proof"
          for media_case in 'media158_test.gd|MEDIA158: PASS' 'soundtrack158_test.gd|SOUNDTRACK158: PASS' 'dialogue_voice158_test.gd|VOICE158: PASS'; do
            media_script="${media_case%%|*}"
            media_marker="${media_case#*|}"
            export XDG_DATA_HOME="$RUNNER_TEMP/windows-source-$media_script-user"
            timeout --kill-after=5s 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script "tools/$media_script" 2>&1 | tee "$RUNNER_TEMP/media158-proof/$media_script.log"
            if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$RUNNER_TEMP/media158-proof/$media_script.log"; then exit 1; fi
            grep -Fq "$media_marker" "$RUNNER_TEMP/media158-proof/$media_script.log"
          done
      - name: Inspect actual PE, PCK, cinematics and runtime inventory
        run: |
          set -euo pipefail
          python3 tools/verify_windows_package157.py create --directory build/windows/AcornHunter --source "$SOURCE_SHA" --tree "${{ steps.source.outputs.tree }}" --checkout "${{ steps.source.outputs.checkout }}" --report "$RUNNER_TEMP/windows-package-create.json"
          python3 tools/verify_windows_package157.py verify-directory --directory build/windows/AcornHunter --expected-source "$SOURCE_SHA" --expected-tree "${{ steps.source.outputs.tree }}" --expected-checkout "${{ steps.source.outputs.checkout }}" --report "$RUNNER_TEMP/windows-package-verify.json"
      - name: Upload the portable Windows folder
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: AcornHunter-1.58-Windows-x64-${{ github.sha }}
          path: build/windows/AcornHunter/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Preserve export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Export-Proof-${{ github.sha }}
          path: |
            import-windows.log
            export-windows.log
            ${{ runner.temp }}/windows-package-*.json
            ${{ runner.temp }}/media158-proof/
          if-no-files-found: ignore
          retention-days: 14

  resolve-package:
    needs: export-windows
    if: always() && !inputs.android_media_only && (needs.export-windows.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.artifact_id != ''))
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.resolve.outputs.artifact-id }}
      artifact-run-id: ${{ steps.resolve.outputs.artifact-run-id }}
      artifact-digest: ${{ steps.resolve.outputs.artifact-digest }}
      artifact-bytes: ${{ steps.resolve.outputs.artifact-bytes }}
      source-sha: ${{ steps.resolve.outputs.source-sha }}
      source-tree: ${{ steps.resolve.outputs.source-tree }}
      checkout-sha: ${{ steps.resolve.outputs.checkout-sha }}
    steps:
      - name: Checkout the pinned artifact resolver
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/windows157/resolve_artifact.py
          sparse-checkout-cone-mode: false
      - name: Pin the original artifact metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_ARTIFACT_ID: ${{ inputs.artifact_id || needs.export-windows.outputs.artifact-id }}
          WINDOWS_SOURCE_SHA: ${{ inputs.source_sha || env.SOURCE_SHA }}
          WINDOWS_SOURCE_TREE: ${{ inputs.source_tree || needs.export-windows.outputs.source-tree }}
          WINDOWS_CHECKOUT_SHA: ${{ inputs.checkout_sha || needs.export-windows.outputs.checkout-sha }}
        run: python3 tools/windows157/resolve_artifact.py resolve

  verify-windows-executable:
    needs: resolve-package
    if: ${{ !cancelled() && needs.resolve-package.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      WINDOWS_ARTIFACT_ID: ${{ needs.resolve-package.outputs.artifact-id }}
      WINDOWS_ARTIFACT_RUN_ID: ${{ needs.resolve-package.outputs.artifact-run-id }}
      WINDOWS_ARTIFACT_DIGEST: ${{ needs.resolve-package.outputs.artifact-digest }}
      WINDOWS_ARTIFACT_BYTES: ${{ needs.resolve-package.outputs.artifact-bytes }}
      WINDOWS_SOURCE_SHA: ${{ needs.resolve-package.outputs.source-sha }}
      WINDOWS_SOURCE_TREE: ${{ needs.resolve-package.outputs.source-tree }}
      WINDOWS_CHECKOUT_SHA: ${{ needs.resolve-package.outputs.checkout-sha }}
      WINDOWS_HARNESS_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the same external acceptance scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the exact shipping artifact
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.resolve-package.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-package.outputs.artifact-run-id }}
          path: ${{ runner.temp }}/shipping
          merge-multiple: true
      - name: Validate the downloaded PE, pack and metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/windows157/resolve_artifact.py validate --report "$env:RUNNER_TEMP/windows-proof/artifact-source-equivalence.json"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical artifact or production source equivalence failed' }
          python tools/verify_windows_package157.py verify-directory --directory "$env:RUNNER_TEMP/shipping" --expected-source "$env:WINDOWS_SOURCE_SHA" --expected-tree "$env:WINDOWS_SOURCE_TREE" --expected-checkout "$env:WINDOWS_CHECKOUT_SHA" --report "$env:RUNNER_TEMP/windows-proof/static-package.json"
          if ($LASTEXITCODE -ne 0) { throw 'Actual package validation failed' }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("$env:RUNNER_TEMP/shipping/AcornHunter.exe")
          if ($version.FileVersion -ne '1.58.0.0' -or $version.ProductVersion -ne '1.58.0.0') { throw 'Actual PE file/product version differs' }
          $version | Select-Object FileVersion, ProductVersion, ProductName | ConvertTo-Json | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/windows-proof/pe-version.json"
      - name: Start the untouched shipping Windows release normally
        shell: pwsh
        run: |
          python tools/windows157/run_exported_test.py --exe "$env:RUNNER_TEMP/shipping/AcornHunter.exe" --startup-only --output "$env:RUNNER_TEMP/windows-proof/canonical-startup" --timeout 90
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Windows release startup failed' }
      - name: Exercise every scene using byte-identical shipping EXE and PCK
        shell: pwsh
        run: |
          python tools/windows157/run_exported_test.py --exe "$env:RUNNER_TEMP/shipping/AcornHunter.exe" --script tools/windows157/runtime_smoke.gd --output "$env:RUNNER_TEMP/windows-proof/headless-runtime" --marker 'WINDOWS157 EXPORTED: PASS' --expect-runtime-report --timeout 420
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows release executable failed' }
      - name: Exercise desktop graphics and controls from the packaged game
        shell: pwsh
        run: |
          python tools/windows157/run_exported_test.py --exe "$env:RUNNER_TEMP/shipping/AcornHunter.exe" --script tools/desktop_graphics157_test.gd --output "$env:RUNNER_TEMP/windows-proof/graphics" --marker 'DESKTOP GRAPHICS157: PASS' --timeout 180
          if ($LASTEXITCODE -ne 0) { throw 'Packaged desktop graphics failed' }
          python tools/windows157/run_exported_test.py --exe "$env:RUNNER_TEMP/shipping/AcornHunter.exe" --script tools/desktop_controls157_test.gd --output "$env:RUNNER_TEMP/windows-proof/controls" --marker 'DESKTOP CONTROLS157: PASS' --timeout 240
          if ($LASTEXITCODE -ne 0) { throw 'Packaged desktop controls failed' }
      - name: Confirm the canonical package has no injected graphics libraries
        id: software-gl
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($forbidden in @('opengl32.dll', 'libgallium_wgl.dll', 'libEGL.dll', 'libGLESv2.dll', 'AcornHunter.exe.local', 'override.cfg')) {
            if (Test-Path "$env:RUNNER_TEMP/shipping/$forbidden") { throw "Unexpected test-only file in canonical package: $forbidden" }
          }
      - name: Verify the actual packaged1.58 music and spoken dialogue
        shell: pwsh
        run: |
          python tools/windows157/run_exported_test.py --exe "$env:RUNNER_TEMP/shipping/AcornHunter.exe" --script tools/media158_test.gd --output "$env:RUNNER_TEMP/windows-proof/media158" --marker 'MEDIA158: PASS' --timeout 180
          if ($LASTEXITCODE -ne 0) { throw 'Packaged cinematic media158 failed' }
          python tools/windows157/run_exported_test.py --exe "$env:RUNNER_TEMP/shipping/AcornHunter.exe" --script tools/soundtrack158_test.gd --output "$env:RUNNER_TEMP/windows-proof/soundtrack158" --marker 'SOUNDTRACK158: PASS' --timeout 180
          if ($LASTEXITCODE -ne 0) { throw 'Packaged soundtrack158 failed' }
          python tools/windows157/run_exported_test.py --exe "$env:RUNNER_TEMP/shipping/AcornHunter.exe" --script tools/dialogue_voice158_test.gd --output "$env:RUNNER_TEMP/windows-proof/voice158" --marker 'VOICE158: PASS' --timeout 180
          if ($LASTEXITCODE -ne 0) { throw 'Packaged dialogue voice158 failed' }
      - name: Exercise the untouched Windows menu with real OS mouse and keys
        id: canonical-menu
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/windows157/windows_menu_smoke.py --exe "$env:RUNNER_TEMP/shipping/AcornHunter.exe" --output "$env:RUNNER_TEMP/windows-proof/canonical-menu"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical native Windows menu failed' }
      - name: Render the actual Windows game in high and low profiles
        id: native-render
        continue-on-error: true
        if: ${{ !cancelled() && steps.software-gl.outcome == 'success' }}
        shell: pwsh
        run: |
          python tools/windows157/run_exported_test.py --exe "$env:RUNNER_TEMP/shipping/AcornHunter.exe" --script tools/windows157/runtime_smoke.gd --output "$env:RUNNER_TEMP/windows-proof/native-angle" --marker 'WINDOWS157 EXPORTED: PASS' --native --expect-runtime-report --timeout 600
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows native renderer failed' }
      - name: Exercise actual Windows native mouse and keyboard controls
        id: native-controls
        continue-on-error: true
        if: ${{ !cancelled() && steps.software-gl.outcome == 'success' }}
        shell: pwsh
        run: |
          python tools/windows157/run_exported_test.py --exe "$env:RUNNER_TEMP/shipping/AcornHunter.exe" --script tools/desktop_controls157_test.gd --output "$env:RUNNER_TEMP/windows-proof/native-controls" --marker 'DESKTOP CONTROLS157: PASS' --native --timeout 360
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows native mouse/keyboard controls failed' }
      - name: Capture the packaged pink intro and credits on native Windows
        id: native-media
        continue-on-error: true
        if: ${{ !cancelled() && steps.software-gl.outcome == 'success' }}
        shell: pwsh
        run: |
          python tools/windows157/run_exported_test.py --exe "$env:RUNNER_TEMP/shipping/AcornHunter.exe" --script tools/media158_test.gd --output "$env:RUNNER_TEMP/windows-proof/native-media158" --marker 'MEDIA158: PASS' --native --timeout 240
          if ($LASTEXITCODE -ne 0) { throw 'Native packaged pink intro and credits failed' }
      - name: Recheck canonical shipping files after all native tests
        id: shipping-unchanged
        if: ${{ !cancelled() && steps.software-gl.outcome == 'success' }}
        shell: pwsh
        run: |
          python tools/verify_windows_package157.py verify-directory --directory "$env:RUNNER_TEMP/shipping" --expected-source "$env:WINDOWS_SOURCE_SHA" --expected-tree "$env:WINDOWS_SOURCE_TREE" --expected-checkout "$env:WINDOWS_CHECKOUT_SHA" --report "$env:RUNNER_TEMP/windows-proof/shipping-unchanged.json"
          if ($LASTEXITCODE -ne 0) { throw 'Test modified the shipping package' }
      - name: Require every independent native acceptance to pass
        if: always()
        shell: pwsh
        env:
          CANONICAL_MENU: ${{ steps.canonical-menu.outcome }}
          NATIVE_RENDER: ${{ steps.native-render.outcome }}
          NATIVE_CONTROLS: ${{ steps.native-controls.outcome }}
          SHIPPING_UNCHANGED: ${{ steps.shipping-unchanged.outcome }}
          NATIVE_MEDIA: ${{ steps.native-media.outcome }}
        run: |
          $states = @($env:CANONICAL_MENU, $env:NATIVE_RENDER, $env:NATIVE_CONTROLS, $env:SHIPPING_UNCHANGED, $env:NATIVE_MEDIA)
          if (@($states | Where-Object { $_ -ne 'success' }).Count -gt 0) { throw "Native Windows acceptance incomplete or failed: $($states -join ', ')" }
      - name: Preserve actual Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Runtime-Proof-${{ github.sha }}
          path: ${{ runner.temp }}/windows-proof/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
