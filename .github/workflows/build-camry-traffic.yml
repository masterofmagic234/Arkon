name: Build Blender game assets

on:
  push:
    paths:
      - "blender/**"
      - ".github/workflows/build-camry-traffic.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build all Blender assets
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
          tar -xf blender-4.5.14-linux-x64.tar.xz
          mkdir -p build/blender

          shopt -s nullglob
          assets=(blender/assets/*.py)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No Blender asset scripts found"
            exit 1
          fi

          for script in "${assets[@]}"; do
            name="$(basename "${script}" .py)"
            echo "=== Building ${name} ==="
            BLENDER_ASSET_OUTPUT="$(pwd)/build/blender/${name}.blend" \
              ./blender-4.5.14-linux-x64/blender -b --python "${script}"
            test -s "build/blender/${name}.blend"
          done

      - name: Upload Blender assets
        uses: actions/upload-artifact@v4
        with:
          name: blender-game-assets
          path: build/blender/*.blend
          if-no-files-found: error
