name: Build Camry traffic Blender asset

on:
  push:
    paths:
      - ".github/workflows/build-camry-traffic.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Camry-inspired traffic car
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
          tar -xf blender-4.5.14-linux-x64.tar.xz

          cat > camry_traffic.py <<'PY'
          import bpy, math
          from mathutils import Vector

          # Clean scene
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)
          for c in list(bpy.data.collections):
              if c.name != "Collection":
                  bpy.data.collections.remove(c)

          def make_mat(name, color, metallic=0.0, roughness=0.35):
              m = bpy.data.materials.get(name) or bpy.data.materials.new(name)
              m.diffuse_color = (*color, 1)
              m.use_nodes = True
              bs = m.node_tree.nodes.get("Principled BSDF")
              bs.inputs["Base Color"].default_value = (*color, 1)
              bs.inputs["Metallic"].default_value = metallic
              bs.inputs["Roughness"].default_value = roughness
              return m

          paint = make_mat("Camry Red Metallic", (0.42, 0.006, 0.014), 0.72, 0.22)
          paint2 = make_mat("Paint highlight", (0.62, 0.012, 0.022), 0.65, 0.23)
          glass = make_mat("Smoked Glass", (0.035, 0.075, 0.095), 0.2, 0.16)
          black = make_mat("Gloss Black Trim", (0.008, 0.01, 0.012), 0.18, 0.28)
          rubber = make_mat("Tire", (0.012, 0.014, 0.016), 0.0, 0.86)
          alloy = make_mat("Alloy", (0.48, 0.53, 0.58), 0.82, 0.2)
          chrome = make_mat("Chrome", (0.72, 0.75, 0.78), 0.9, 0.15)
          lamp = make_mat("LED White", (0.75, 0.9, 1.0), 0.18, 0.16)
          tail = make_mat("Tail Red", (0.58, 0.004, 0.008), 0.22, 0.2)
          interior = make_mat("Interior", (0.018, 0.022, 0.025), 0.0, 0.72)
          plate = make_mat("Plate", (0.78, 0.79, 0.76), 0.05, 0.4)

          def add_mesh(name, verts, faces, material, bevel=0.0):
              me = bpy.data.meshes.new(name + "_Mesh")
              me.from_pydata(verts, [], faces)
              me.update()
              me.materials.append(material)
              ob = bpy.data.objects.new(name, me)
              bpy.context.collection.objects.link(ob)
              if bevel:
                  b = ob.modifiers.new("Automotive Bevel", "BEVEL")
                  b.width = bevel
                  b.segments = 3
                  ob.modifiers.new("Weighted Normals", "WEIGHTED_NORMAL")
              return ob

          def cube(name, loc, dims, material, bevel=0.025):
              bpy.ops.mesh.primitive_cube_add(size=1, location=loc)
              ob = bpy.context.object
              ob.name = name
              ob.dimensions = dims
              bpy.ops.object.transform_apply(location=False, rotation=False, scale=True)
              ob.data.materials.append(material)
              if bevel:
                  b = ob.modifiers.new("Soft edges", "BEVEL")
                  b.width = bevel
                  b.segments = 3
                  ob.modifiers.new("Weighted Normals", "WEIGHTED_NORMAL")
              return ob

          def cyl(name, loc, radius, depth, material, axis="Y", verts=24):
              bpy.ops.mesh.primitive_cylinder_add(vertices=verts, radius=radius, depth=depth, location=loc)
              ob = bpy.context.object
              ob.name = name
              ob.data.materials.append(material)
              if axis == "Y":
                  ob.rotation_euler[0] = math.pi/2
              elif axis == "X":
                  ob.rotation_euler[1] = math.pi/2
              bpy.ops.object.shade_smooth()
              return ob

          def sphere(name, loc, scale, material, seg=24, rings=12):
              bpy.ops.mesh.primitive_uv_sphere_add(segments=seg, ring_count=rings, location=loc)
              ob = bpy.context.object
              ob.name = name
              ob.scale = scale
              bpy.ops.object.transform_apply(location=False, rotation=False, scale=True)
              ob.data.materials.append(material)
              bpy.ops.object.shade_smooth()
              return ob

          def beam(name, a, b, radius, material, verts=12):
              a, b = Vector(a), Vector(b)
              d = b-a
              bpy.ops.mesh.primitive_cylinder_add(vertices=verts, radius=radius, depth=d.length, location=(a+b)/2)
              ob = bpy.context.object
              ob.name = name
              ob.rotation_mode = "QUATERNION"
              ob.rotation_quaternion = d.to_track_quat("Z","Y")
              ob.data.materials.append(material)
              return ob

          # Root empty and asset metadata
          bpy.ops.object.empty_add(type="PLAIN_AXES", location=(0,0,0))
          root = bpy.context.object
          root.name = "TRAFFIC_CAMRY_ROOT"
          root["asset_role"] = "incoming traffic vehicle"
          root["approx_real_dimensions_m"] = "4.89 x 1.84 x 1.45"
          root["forward_axis"] = "-X"
          root["source_style"] = "Toyota Camry XV70-inspired, not an exact factory scan"

          # Main body shell, front at -X.
          sec = [
              (-2.48,0.56,0.45,0.76),
              (-2.22,0.78,0.44,0.84),
              (-1.65,0.91,0.43,0.93),
              (-0.30,0.93,0.43,0.98),
              ( 1.05,0.91,0.44,0.96),
              ( 1.92,0.84,0.45,0.89),
              ( 2.40,0.72,0.46,0.80),
          ]
          verts=[]
          for x, w, z0, ztop in sec:
              verts += [
                  (x,-w,z0),(x,w,z0),
                  (x,w,ztop-0.16),(x,w*0.78,ztop),
                  (x,-w*0.78,ztop),(x,-w,ztop-0.16)
              ]
          faces=[]
          n=6
          for i in range(len(sec)-1):
              for j in range(n):
                  a=i*n+j; b=i*n+(j+1)%n; c=(i+1)*n+(j+1)%n; d=(i+1)*n+j
                  faces.append((a,b,c,d))
          faces += [tuple(range(5,-1,-1)), tuple((len(sec)-1)*6+j for j in range(6))]
          body=add_mesh("Main Camry-style body", verts, faces, paint, 0.055)
          body.parent=root

          # Sculpted hood and front shoulder.
          hood = add_mesh("Hood", [
              (-2.28,-0.70,0.80),(-2.28,0.70,0.80),
              (-1.28, -0.72,0.99),(-1.28,0.72,0.99),
              (-0.58,-0.62,1.03),(-0.58,0.62,1.03)
          ], [(0,1,3,2),(2,3,5,4)], paint2, 0.035)
          hood.parent=root
          for y in (-0.42,0.42):
              crease=beam("Hood character line",(-2.22,y*0.92,0.855),(-1.00,y,1.015),0.010,paint2)
              crease.parent=root

          # Roof/greenhouse.
          add_mesh("Greenhouse roof", [
              (-1.25,-0.68,0.98),(-1.25,0.68,0.98),
              (-0.63,-0.55,1.43),(-0.63,0.55,1.43),
              ( 0.62,-0.55,1.42),(0.62,0.55,1.42),
              ( 1.37,-0.67,0.96),(1.37,0.67,0.96)
          ], [(0,1,3,2),(2,3,5,4),(4,5,7,6),(0,2,4,6),(1,7,5,3)], paint, 0.028)

          # Glass areas.
          add_mesh("Windshield", [
              (-1.19,-0.575,0.99),(-1.19,0.575,0.99),(-0.66,0.49,1.375),(-0.66,-0.49,1.375)
          ], [(0,1,2,3)], glass, 0.008)
          add_mesh("Rear glass", [
              (0.66,-0.50,1.37),(0.66,0.50,1.37),(1.30,0.60,1.00),(1.30,-0.60,1.00)
          ], [(0,1,2,3)], glass, 0.008)

          for side in (-1,1):
              add_mesh("Front side glass", [
                  (-1.10,side*0.655,1.01),(-0.66,side*0.53,1.36),(0.00,side*0.53,1.36),(0.00,side*0.69,1.01)
              ], [(0,1,2,3)], glass, 0.008)
              add_mesh("Rear side glass", [
                  (0.09,side*0.69,1.01),(0.09,side*0.53,1.36),(0.58,side*0.53,1.36),(1.20,side*0.64,1.01)
              ], [(0,1,2,3)], glass, 0.008)

              cube("B pillar",(0.05,side*0.686,1.18),(0.07,0.035,0.43),black,0.015)
              cube("C pillar",(0.91,side*0.645,1.18),(0.06,0.035,0.34),black,0.012)
              cube("Door handle",(-0.13,side*0.744,0.78),(0.22,0.025,0.035),chrome,0.012)
              cube("Side skirt",(0.02,side*0.825,0.52),(2.62,0.08,0.12),black,0.025)
              sphere("Side mirror",(-0.96,side*0.80,0.92),(0.13,0.10,0.08),paint,16,8)
              cube("Mirror glass",(-0.96,side*0.892,0.925),(0.11,0.012,0.06),glass,0.01)

          # Front fascia: lower mouth, upper grille, emblem.
          cube("Lower grille",(-2.465,0,0.59),(0.06,1.30,0.34),black,0.075)
          for z in (0.47,0.53,0.59,0.65,0.71):
              cube("Grille slat",(-2.505,0,z),(0.022,1.18,0.018),alloy,0.006)
          cube("Upper grille",(-2.49,0,0.84),(0.04,0.78,0.08),black,0.03)
          sphere("Oval badge",(-2.535,0,0.84),(0.025,0.10,0.067),chrome,24,12)

          # Aggressive swept LED lamps and fog lamps.
          for side in (-1,1):
              add_mesh("LED headlamp", [
                  (-2.43,side*0.28,0.83),(-2.34,side*0.69,0.79),(-1.96,side*0.62,0.88),(-2.04,side*0.29,0.92)
              ], [(0,1,2,3)], lamp, 0.016)
              cube("Fog bezel",(-2.43,side*0.52,0.47),(0.045,0.20,0.10),alloy,0.025)
              cube("Fog lamp",(-2.455,side*0.52,0.47),(0.018,0.09,0.035),lamp,0.008)

          # Rear lamps and bumper.
          for side in (-1,1):
              add_mesh("Rear tail lamp", [
                  (2.39,side*0.20,0.82),(2.37,side*0.66,0.78),(2.02,side*0.61,0.87),(2.04,side*0.22,0.92)
              ], [(0,1,2,3)], tail, 0.016)
          cube("Rear plate",(2.45,0,0.66),(0.025,0.52,0.14),plate,0.012)
          cube("Rear dark trim",(2.43,0,0.52),(0.06,0.98,0.08),black,0.028)
          for side in (-1,1):
              cyl("Exhaust tip",(2.46,side*0.54,0.48),0.05,0.13,chrome,"X",18)

          # Wheels with alloy spokes.
          for x in (-1.48,1.44):
              for side in (-1,1):
                  y=side*0.86; z=0.47
                  bpy.ops.mesh.primitive_torus_add(major_radius=0.285,minor_radius=0.095,major_segments=32,minor_segments=12,location=(x,y,z),rotation=(math.pi/2,0,0))
                  tire=bpy.context.object; tire.name="Tire"; tire.data.materials.append(rubber); bpy.ops.object.shade_smooth(); tire.parent=root
                  cyl("Wheel rim",(x,y, z),0.225,0.075,alloy,"Y",32).parent=root
                  cyl("Rim inset",(x,y+side*0.042,z),0.165,0.025,black,"Y",28).parent=root
                  cyl("Center cap",(x,y+side*0.061,z),0.05,0.018,chrome,"Y",20).parent=root
                  for k in range(10):
                      a=2*math.pi*k/10
                      r1=0.045; r2=0.18
                      beam("Wheel spoke",
                           (x+math.sin(a)*r1,y+side*0.08,z+math.cos(a)*r1),
                           (x+math.sin(a+0.16)*r2,y+side*0.08,z+math.cos(a+0.16)*r2),
                           0.012,alloy,8).parent=root

          # Interior silhouettes.
          cube("Dashboard",(-0.82,0,1.00),(0.48,1.02,0.12),interior,0.04).parent=root
          for side in (-1,1):
              cube("Front seat",(-0.20,side*0.25,1.05),(0.28,0.30,0.42),interior,0.07).parent=root
              cube("Rear seat",(0.78,side*0.23,1.01),(0.25,0.32,0.28),interior,0.06).parent=root

          # Roof antenna.
          beam("Roof antenna",(0.75,0,1.43),(0.92,0,1.52),0.010,black,10)

          # Ground only for preview, not exported.
          bpy.ops.mesh.primitive_plane_add(size=20, location=(0,0,0))
          floor=bpy.context.object; floor.name="PREVIEW_GROUND"
          floor.data.materials.append(make_mat("Preview Ground",(0.055,0.06,0.065),0.0,0.9))

          def area(name, loc, power, size):
              bpy.ops.object.light_add(type="AREA", location=loc)
              l=bpy.context.object; l.name=name; l.data.energy=power; l.data.shape="DISK"; l.data.size=size
              l.rotation_euler=(Vector((0,0,0.65))-l.location).to_track_quat("-Z","Y").to_euler()
          area("Key",(-4,-5,7),1100,5)
          area("Fill",(0,4,5),850,4)
          area("Rim",(4,-2,4),950,3)

          bpy.ops.object.camera_add(location=(-7.1,-7.6,3.6))
          cam=bpy.context.object; cam.name="PREVIEW_CAMERA"
          cam.rotation_euler=(Vector((0,0,0.78))-cam.location).to_track_quat("-Z","Y").to_euler()
          cam.data.lens=55
          bpy.context.scene.camera=cam

          scene=bpy.context.scene
          scene.render.engine="BLENDER_WORKBENCH"
          scene.render.resolution_x=1280
          scene.render.resolution_y=720
          scene.render.resolution_percentage=100
          scene.render.image_settings.file_format="PNG"
          scene.render.filepath=os.path.join(os.getcwd(),"camry_traffic_preview.png")
          scene.world.color=(0.12,0.12,0.12)

          # Select the actual asset objects, hide preview helpers from export.
          for ob in bpy.context.scene.objects:
              ob.select_set(False)
          root.select_set(True)
          bpy.context.view_layer.objects.active=root
          # Remove preview ground before export/save.
          floor.hide_render=True
          floor.hide_viewport=True

          # Export the traffic vehicle to GLB too; useful later for Godot.
          try:
              bpy.ops.export_scene.gltf(filepath=os.path.join(os.getcwd(),"camry_traffic.glb"), export_format="GLB", use_selection=False)
          except Exception as e:
              print("GLB export warning:", e)

          # Render preview first, then save the complete editable Blender file.
          floor.hide_render=False
          floor.hide_viewport=False
          bpy.ops.render.render(write_still=True)
          out="//camry_traffic.blend"
          bpy.ops.wm.save_as_mainfile(filepath=out)
          print("SAVED", out)
          PY

          ./blender-4.5.14-linux-x64/blender -b --python camry_traffic.py
          test -s camry_traffic.blend
          test -s camry_traffic_preview.png
          test -s camry_traffic.glb || true

      - name: Upload Blender asset
        uses: actions/upload-artifact@v4
        with:
          name: camry-traffic-blender
          path: |
            camry_traffic.blend
            camry_traffic_preview.png
            camry_traffic.glb
          if-no-files-found: error
