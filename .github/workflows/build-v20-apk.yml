name: Build V20 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout V20
        uses: actions/checkout@v5

      - name: Prepare Darina poses
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/prepare_darina.py

      - name: Prepare squirrel transparent sprites
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/prepare_squirrel_sprites.py

      - name: Install FFmpeg
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Prepare intro cinematic videos
        run: |
          set -euxo pipefail
          mkdir -p assets/intro_video

          for input in \
            1789649201942.mp4 \
            1789649329293.mp4 \
            1789650644963.mp4 \
            1789650878847.mp4
          do
            output="assets/intro_video/${input%.mp4}.ogv"
            ffmpeg -y -hide_banner -loglevel error \
              -i "$input" \
              -vf "scale=trunc(min(1280/iw\\,720/ih)*iw/2)*2:trunc(min(1280/iw\\,720/ih)*ih/2)*2:flags=lanczos" \
              -c:v libtheora -q:v 7 -g 128 \
              -an \
              "$output"
            test -s "$output"
            ffprobe -v error -show_entries format=duration -of default=nw=1 "$output"
          done

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Godot 4.7
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Godot Android export templates
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.stable"
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          find /tmp/godot_templates -type f -name 'android_debug.apk' -o -name 'android_release.apk' | head
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.stable/"

      - name: Validate Godot project
        run: |
          set -euo pipefail
          set +e
          godot --headless --path . --import 2>&1 | tee /tmp/godot-validate.log
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            echo "Godot editor validation exited with status $godot_status"
            exit "$godot_status"
          fi
          if grep -Eq 'SCRIPT ERROR: (Parse Error|Compile Error)|Failed to compile depended scripts|Parse Error:' /tmp/godot-validate.log; then
            echo "Godot script validation found errors"
            exit 1
          fi

      - name: Inspect Scout rig
        run: |
          set -euxo pipefail
          godot --headless --path . --script tools/inspect_scout_rig.gd

      - name: Run Level 2 smoke test
        run: |
          set -euxo pipefail
          godot --headless --path . --script tools/level2_smoke_test.gd

      - name: Run Level 1 smoke test
        timeout-minutes: 2
        run: |
          set -euxo pipefail
          timeout --signal=TERM --kill-after=5s 60s godot --headless --path . --script tools/level1_smoke_test.gd

      - name: Prepare ADB for Godot Android export
        run: |
          set -euxo pipefail
          adb start-server
          adb devices
          adb version

      - name: Export V20 Android APK
        run: |
          set -euxo pipefail
          mkdir -p build
          rm -f build/AcornHunter-V20.apk
          godot --headless --path . --export-debug Android build/AcornHunter-V20.apk
          test -s build/AcornHunter-V20.apk
          ls -lh build/AcornHunter-V20.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AcornHunter-V20-APK
          path: build/AcornHunter-V20.apk
          if-no-files-found: error
