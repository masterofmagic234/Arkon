name: Import generated wall textures
on:
  push:
    paths:
      - '.github/workflows/import_wall_assets.yml'
permissions:
  contents: write
jobs:
  import-walls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download generated wall textures
        run: |
          set -euo pipefail
          curl -fL 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:a5ad6dc3-b25a-4d68-88b3-5407e3bb03e7' -o assets/wall_new_01_mossy_stone.png
          curl -fL 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:952458d9-970c-4c13-8f7c-23f24248d245' -o assets/wall_new_02_overgrown.png
          curl -fL 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:ff38ac72-6fb0-48e4-96d2-3dfbaaa94768' -o assets/wall_new_03_brick_stone.png
          curl -fL 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:6c3fcbc9-f10c-43d0-8654-8d5f4fa5733b' -o assets/wall_new_04_wooden_fence.png
          curl -fL 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:17998c6c-5f59-4f2c-b7de-5f72a44eadf0' -o assets/wall_new_05_ruined_temple.png
          curl -fL 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:ad875ee1-c2fa-41ea-aadb-ebc39db134f3' -o assets/wall_new_06_autumn.png
      - name: Wire textures into Godot scene
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('game.tscn')
          s = p.read_text()
          mapping = {
            'rock_wall_01_4k.jpg':'wall_new_01_mossy_stone.png',
            'rock_wall_02_4k.jpg':'wall_new_02_overgrown.png',
            'rock_wall_03_4k.jpg':'wall_new_03_brick_stone.png',
            'rock_wall_04_4k.jpg':'wall_new_04_wooden_fence.png',
            'rock_wall_05_4k.jpg':'wall_new_05_ruined_temple.png',
            'rock_wall_06_4k.jpg':'wall_new_06_autumn.png',
            'rock_wall_07_4k.jpg':'wall_new_01_mossy_stone.png',
            'rock_wall_08_4k.jpg':'wall_new_02_overgrown.png',
            'wall_mural_mossy_stone.png':'wall_new_01_mossy_stone.png',
            'wall_mural_overgrown.png':'wall_new_02_overgrown.png',
            'wall_mural_brick_stone.png':'wall_new_03_brick_stone.png',
            'wall_mural_wooden_fence.png':'wall_new_04_wooden_fence.png',
            'wall_mural_ruined_temple.png':'wall_new_05_ruined_temple.png',
            'wall_mural_autumn.png':'wall_new_06_autumn.png',
          }
          for old,new in mapping.items():
              s = s.replace(old,new)
          p.write_text(s)
          PY
      - name: Remove old wall assets
        run: |
          rm -f assets/rock_wall_01.png assets/rock_wall_02.png assets/rock_wall_03.png assets/rock_wall_04.png assets/rock_wall_05.png assets/rock_wall_06.png assets/rock_wall_07.png assets/rock_wall_08.png
          rm -f assets/rock_wall_01_4k.jpg assets/rock_wall_02_4k.jpg assets/rock_wall_03_4k.jpg assets/rock_wall_04_4k.jpg assets/rock_wall_05_4k.jpg assets/rock_wall_06_4k.jpg assets/rock_wall_07_4k.jpg assets/rock_wall_08_4k.jpg
          rm -f assets/wall_mural_mossy_stone.png assets/wall_mural_overgrown.png assets/wall_mural_brick_stone.png assets/wall_mural_wooden_fence.png assets/wall_mural_ruined_temple.png assets/wall_mural_autumn.png
          rm -f assets/wall_autumn_full.svg assets/wall_brick_stone_full.svg assets/wall_mossy_stone_full.svg assets/wall_overgrown_full.svg assets/wall_ruined_temple_full.svg assets/wall_wood_fence_full.svg
          rm -f assets/wall_final_autumn.svg assets/wall_final_brick_stone.svg assets/wall_final_mossy_stone.svg assets/wall_final_overgrown.svg assets/wall_final_ruined_temple.svg assets/wall_final_wooden_fence.svg
      - name: Commit wall replacement
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Replace all wall textures with new generated set'
          git push
