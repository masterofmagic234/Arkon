name: ACORN HUNTER — Android Build\n\non:\n  push:\n    branches:\n      - main\n      - "fix/**"\n  pull_request:\n    branches:\n      - main\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\nenv:\n  GODOT_VERSION: "4.7.2-stable"\n\njobs:\n  validate-and-build:\n    runs-on: ubuntu-22.04\n\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Set up Java 17\n        uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: "17"\n\n      - name: Set up Android SDK\n        uses: android-actions/setup-android@v3\n\n      - name: Install Android SDK packages\n        run: |\n          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"\n\n      - name: Set up Godot 4.7.2\n        uses: chickensoft-games/setup-godot@v2\n        with:\n          version: ${{env.GODOT_VERSION}}\n          use-dotnet: false\n          include-templates: true\n\n      - name: Import project\n        run: godot --headless --path . --editor --quit\n\n      - name: Run Level 2 smoke test\n        run: godot --headless --path . --script tools/level2_smoke_test.gd\n\n      - name: Run full game flow smoke test\n        run: godot --headless --path . --script tools/full_game_flow_smoke_test.gd\n\n      - name: Export Android APK\n        run: |\n          mkdir -p build\n          godot --headless --path . --export-debug "Android" build/AcornHunter-V20.apk\n\n      - name: Upload Android APK\n        uses: actions/upload-artifact@v4\n        with:\n          name: ACORN-HUNTER-${{github.sha}}-Android\n          path: build/AcornHunter-V20.apk\n          if-no-files-found: error\n          retention-days: 14\n