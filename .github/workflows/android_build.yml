          timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/botanical_access151_test.gd -- --output="$proof" 2>&1 | tee "$proof/test.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
          grep -q "BOTANICAL ACCESS151: PASS" "$proof/test.log"

      - name: Verify151 vehicle visibility contracts
        timeout-minutes: 4
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/campaign151/headless/vehicle-visibility"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/campaign151-vehicle-visibility-user"
          timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level2_vehicle_visibility151_test.gd -- --output="$proof" 2>&1 | tee "$proof/test.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
