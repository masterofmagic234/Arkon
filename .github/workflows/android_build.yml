          timeout --kill-after=5s 180s xvfb-run -a -s "-screen 0 2582x1220x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script "$script" -- --visual --output="$proof" 2>&1 | tee "$proof/test.log"
