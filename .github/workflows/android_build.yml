            slow-rivals) script=tools/level2_slow_rivals154_test.gd; marker='LEVEL2 SLOW RIVALS154: PASS'; frame_rate=15 ;;
          esac
          # The software renderer samples the slow case at15 FPS; production
          # physics remains60 Hz and the fixture follows actual race time.
          timeout --kill-after=5s 270s xvfb-run -a -s "-screen 0 3000x1600x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps "$frame_rate" --script "$script" -- --output="$proof" 2>&1 | tee "$proof/test.log"
