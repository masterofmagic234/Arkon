          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
          grep -q "CONTEXT LOADING151: PASS" "$proof/test.log"

      - name: Verify151 hero name contracts
        timeout-minutes: 2
        run: |
          set -euo pipefail
