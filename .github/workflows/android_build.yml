          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/campaign151-hero-name-user"
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/hero_name151_test.gd -- --output="$proof" 2>&1 | tee "$proof/test.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
