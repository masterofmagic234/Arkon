            if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
            grep -Fq "$marker" "$proof/test.log"
          done

      - name: Verify153 outside-arena recovery, clean stairs, calm arrival and readable interactions
