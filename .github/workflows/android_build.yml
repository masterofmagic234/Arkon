          timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/ending_cinematic151_test.gd -- --output="$proof" 2>&1 | tee "$proof/test.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
          grep -q "ENDING151: PASS" "$proof/test.log"

      - name: Independently audit152 whole-level emitted walking geometry and planting
        timeout-minutes: 5
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/campaign152/headless/layout"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/campaign152-layout-user"
          timeout --foreground 90s python3 -m pip install --disable-pip-version-check 'shapely>=2,<3'
          timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/botanical_layout152_capture.gd -- --output="$proof" 2>&1 | tee "$proof/test.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
          grep -Fq 'BOTANICAL LAYOUT152 CAPTURE:' "$proof/test.log"
          python3 tools/check_botanical_layout152.py "$proof/layout152-report.json" --source-root . --output "$proof/independent-layout.json"
          circulation="$RUNNER_TEMP/renderer-checks/campaign152/headless/circulation"
          mkdir -p "$circulation"
          export XDG_DATA_HOME="$RUNNER_TEMP/campaign152-circulation-user"
          timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/botanical_circulation152_test.gd -- --output="$circulation" 2>&1 | tee "$circulation/test.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$circulation/test.log"; then exit 1; fi
          grep -Fq 'BOTANICAL CIRCULATION152: PASS' "$circulation/test.log"

      - name: Verify152 compact HUD, physical race controls and phone bounds
        timeout-minutes: 7
        run: |
          set -euo pipefail
          base_proof="$RUNNER_TEMP/renderer-checks/campaign152/headless"
          for contract in hud race-controls phone; do
            proof="$base_proof/$contract"
            mkdir -p "$proof"
            export XDG_DATA_HOME="$RUNNER_TEMP/campaign152-$contract-user"
            case "$contract" in
              hud) script=tools/botanical_hud152_test.gd; marker='BOTANICAL HUD152: PASS'; extra=() ;;
              race-controls) script=tools/level2_controls152_test.gd; marker='LEVEL2 CONTROLS152: PASS'; extra=(--scene) ;;
              phone) script=tools/ending_phone152_test.gd; marker='ENDING PHONE152: PASS'; extra=() ;;
            esac
            timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script "$script" -- --output="$proof" "${extra[@]}" 2>&1 | tee "$proof/test.log"
            if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
            grep -Fq "$marker" "$proof/test.log"
          done
          python3 tools/check_ending_phone152.py "$base_proof/phone/phone152-report.json" --source-root . --output "$base_proof/phone/independent-bounds.json"

      - name: Verify152 reserve patrol, earned objectives and physical guardian recovery
        timeout-minutes: 7
        run: |
          set -euo pipefail
          for contract in ai arena; do
            proof="$RUNNER_TEMP/renderer-checks/campaign152/headless/$contract"
