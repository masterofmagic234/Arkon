        export LP_NUM_THREADS=4
        export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-native-hero-user"
        timeout --kill-after=5s 90s xvfb-run -a -s "-screen 0 1600x900x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/level3_hero_test.gd -- --visual --output="$proof/hero" 2>&1 | tee "$proof/hero.log"
        export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-native-equipment-user"
        timeout --kill-after=5s 90s xvfb-run -a -s "-screen 0 1600x900x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/level3_cone_equipment_test.gd -- --visual --output="$proof/equipment" 2>&1 | tee "$proof/equipment.log"
        for hero_log in "$proof/hero.log" "$proof/equipment.log"; do
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$hero_log"; then exit 1; fi
        done
        grep -q "LEVEL3 HERO: PASS" "$proof/hero.log"
        grep -q "LEVEL3 CONE EQUIPMENT: PASS" "$proof/equipment.log"

    - name: Verify native close raid direction at desktop and phone aspect ratios
      timeout-minutes: 8
      run: |
        set -euo pipefail
        proof="$RUNNER_TEMP/renderer-checks/overhaul147/direction"
        mkdir -p "$proof"
        direction_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
        export VK_ICD_FILENAMES="${direction_icds[0]}"
        export LP_NUM_THREADS=4
        for direction_size in 1280x720 2582x1220; do
          export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-native-direction-$direction_size-user"
          timeout --kill-after=5s 180s xvfb-run -a -s "-screen 0 3000x1600x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/level3_direction_test.gd -- --visual --size="$direction_size" --output="$proof/$direction_size" 2>&1 | tee "$proof/$direction_size.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/$direction_size.log"; then exit 1; fi
          grep -q "LEVEL3 DIRECTION: PASS" "$proof/$direction_size.log"
        done

    - name: Complete the entire diner story through native player input
      timeout-minutes: 13
      run: |
        set -o pipefail
        new_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
        export VK_ICD_FILENAMES="${new_icds[0]}"
        export LP_NUM_THREADS=4
        timeout --kill-after=5s 720s xvfb-run -a -s "-screen 0 1600x900x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 30 --script tools/level3_playthrough.gd -- --watch --snapshots="$RUNNER_TEMP/renderer-checks/diner-story" 2>&1 | tee diner-story-native.log
        if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' diner-story-native.log; then exit 1; fi
        grep -q "LEVEL 3 PLAYTHROUGH: PASS" diner-story-native.log
    - name: Upload campaign visual and story evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ACORN-HUNTER-Campaign-Visual-${{ github.sha }}
        path: ${{ runner.temp }}/renderer-checks/
        if-no-files-found: ignore
        retention-days: 14
