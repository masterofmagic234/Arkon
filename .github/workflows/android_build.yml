  renderer-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python for native image comparison
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false
      - name: Prepare reviewed intro and park manga videos
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            intro_apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=30)
            # Hosted runners may route through mirror+file lists as well as sources.
            # Replace the slow Azure endpoint in both forms.
            for intro_apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt*mirrors*.txt; do
              if [ -f "$intro_apt_source" ]; then
                sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$intro_apt_source"
              fi
            done
            echo "Updating package index (bounded network and lock waits)"
            timeout --kill-after=10s 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get "${intro_apt_options[@]}" update -qq
            echo "Installing FFmpeg"
            timeout --kill-after=10s 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get "${intro_apt_options[@]}" install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          echo "Converting and validating four reviewed intro clips"
          python3 tools/prepare_intro_videos.py
          python3 tools/prepare_park_escape_video.py

      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Install native graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libvulkan1 mesa-vulkan-drivers
      - name: Verify the exact 1.47 reference rendering and restoration contracts
        timeout-minutes: 4
        run: |
          set -euo pipefail
          perf_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          export VK_ICD_FILENAMES="${perf_icds[0]}"
          export LP_NUM_THREADS=4
          export XDG_DATA_HOME="$RUNNER_TEMP/optimization148-native-contract-user"
          proof="$RUNNER_TEMP/renderer-checks/optimization148/reference-contract"
          mkdir -p "$proof"
          timeout --kill-after=5s 180s xvfb-run -a -s "-screen 0 1600x1000x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/botanical_rendering_test.gd 2>&1 | tee "$proof/rendering147.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/rendering147.log"; then exit 1; fi
          grep -q "BOTANICAL RENDERING: PASS" "$proof/rendering147.log"

      - name: Verify production foliage LOD geometry and immutable instance buffers
        timeout-minutes: 4
        run: |
          set -euo pipefail
          foliage_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          export VK_ICD_FILENAMES="${foliage_icds[0]}"
          export LP_NUM_THREADS=4
          export XDG_DATA_HOME="$RUNNER_TEMP/optimization148-native-foliage-user"
          proof="$RUNNER_TEMP/renderer-checks/optimization148/foliage"
          mkdir -p "$proof"
          timeout --kill-after=5s 180s xvfb-run -a -s "-screen 0 1600x1000x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/botanical_foliage148_test.gd -- --visual --output="$proof" 2>&1 | tee "$proof/foliage148.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/foliage148.log"; then exit 1; fi
          grep -q "BOTANICAL FOLIAGE148: PASS" "$proof/foliage148.log"

      - name: Benchmark 1.47 and 1.48 Compatibility at matched phone settings
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'Pillow>=10,<13'
          perf_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          export VK_ICD_FILENAMES="${perf_icds[0]}"
          export LP_NUM_THREADS=4
          export XDG_DATA_HOME="$RUNNER_TEMP/optimization148-native-benchmark-user"
          proof="$RUNNER_TEMP/renderer-checks/performance"
          mkdir -p "$proof"
          # Adreno disables the GLES depth prepass at engine startup. The
          # orchestrator applies that same policy to BOTH profiles in a private
          # source/import-cache copy; the export checkout and APK stay unchanged.
          timeout --kill-after=5s 870s python3 tools/run_botanical_optimization.py --godot godot --staging "$RUNNER_TEMP/optimization148-project" --output "$proof/ab148" --samples=4 --warmup=2 --timeout=840 2>&1 | tee "$proof/optimization-run.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/optimization-run.log"; then exit 1; fi
          grep -q "BOTANICAL OPTIMIZATION RUN: PASS" "$proof/optimization-run.log"
          python3 tools/compare_botanical_optimization.py "$proof/ab148/optimization.json" --output "$proof/comparison.json" 2>&1 | tee "$proof/comparison.log"
          grep -q "BOTANICAL OPTIMIZATION: PASS" "$proof/comparison.log"

      - name: Verify balanced native phone diagnostics and rendering restoration
        timeout-minutes: 6
        run: |
          set -euo pipefail
          probe_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          export VK_ICD_FILENAMES="${probe_icds[0]}"
          export LP_NUM_THREADS=4
          export XDG_DATA_HOME="$RUNNER_TEMP/optimization148-native-probe-user"
          proof="$RUNNER_TEMP/renderer-checks/performance/probe"
          mkdir -p "$proof"
          timeout --kill-after=5s 300s xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tools/botanical_probe_test.gd -- --native-run --output="$proof" 2>&1 | tee "$proof/native-probe.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/native-probe.log"; then exit 1; fi
          grep -q "BOTANICAL PROBE: PASS" "$proof/native-probe.log"

      - name: Compare the current garden across Forward+ and Compatibility
        timeout-minutes: 9
        run: |
          set -o pipefail
          timeout --kill-after=5s 240s xvfb-run -a -s "-screen 0 1600x1000x24" godot --path . --rendering-method forward_plus --rendering-driver vulkan --audio-driver Dummy --script tools/botanical_renderer_capture.gd -- --expect-renderer=forward_plus --output="$RUNNER_TEMP/renderer-checks/renderer/reference" 2>&1 | tee botanical-forward-reference.log
          timeout --kill-after=5s 240s xvfb-run -a -s "-screen 0 1600x1000x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tools/botanical_renderer_capture.gd -- --expect-renderer=gl_compatibility --output="$RUNNER_TEMP/renderer-checks/renderer/compatibility" 2>&1 | tee botanical-compatibility.log
          for renderer_log in botanical-forward-reference.log botanical-compatibility.log; do
            if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$renderer_log"; then exit 1; fi
            grep -q 'BOTANICAL RENDERER CAPTURE: PASS' "$renderer_log"
          done
          python3 tools/compare_botanical_renderers.py "$RUNNER_TEMP/renderer-checks/renderer/reference" "$RUNNER_TEMP/renderer-checks/renderer/compatibility"

      - name: Verify native CEDAR grip, desktop and phone framing, and model details
        timeout-minutes: 5
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/overhaul147/weapon"
          mkdir -p "$proof"
          weapon_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          export VK_ICD_FILENAMES="${weapon_icds[0]}"
          export LP_NUM_THREADS=4
          export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-native-weapon-user"
          timeout --kill-after=5s 180s xvfb-run -a -s "-screen 0 3000x1600x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/modern_conegun_test.gd -- --visual --output="$proof/gameplay" 2>&1 | tee "$proof/gameplay.log"
          timeout --kill-after=5s 60s xvfb-run -a -s "-screen 0 1600x1000x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/modern_conegun_capture.gd -- --output="$proof/inspection" 2>&1 | tee "$proof/inspection.log"
          for weapon_log in "$proof/gameplay.log" "$proof/inspection.log"; do
            if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$weapon_log"; then exit 1; fi
          done
          grep -q "MODERN CONEGUN: PASS" "$proof/gameplay.log"
          grep -q "CEDAR INSPECTION: PASS" "$proof/inspection.log"

      - name: Verify native imported squirrel deformation and seventeen animation clips
        timeout-minutes: 3
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/overhaul147/rig"
          mkdir -p "$proof"
          rig_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          export VK_ICD_FILENAMES="${rig_icds[0]}"
          export LP_NUM_THREADS=4
          export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-native-rig-user"
          timeout --kill-after=5s 90s xvfb-run -a -s "-screen 0 1600x1000x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/squirrel_rig_test.gd -- --visual --output="$proof" 2>&1 | tee "$proof/rig.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/rig.log"; then exit 1; fi
          grep -q "SQUIRREL RIG: PASS" "$proof/rig.log"

      - name: Verify native physical guard routes, patrol, search and cone attacks
        timeout-minutes: 10
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/overhaul147/guard-ai"
          mkdir -p "$proof"
          guard_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          export VK_ICD_FILENAMES="${guard_icds[0]}"
          export LP_NUM_THREADS=4
          export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-native-ai-user"
          timeout --kill-after=5s 540s xvfb-run -a -s "-screen 0 1600x900x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/botanical_guard_ai_test.gd -- --visual --output="$proof" 2>&1 | tee "$proof/guard-ai.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/guard-ai.log"; then exit 1; fi
          grep -q "BOTANICAL GUARD AI: PASS" "$proof/guard-ai.log"

      - name: Record and independently validate the actual native stereo audio mix
        timeout-minutes: 4
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/overhaul147/audio-native"
          mkdir -p "$proof"
          # Raw MovieMaker video stays outside uploaded evidence. The FLAC is
          # lossless audio from that real recording, with its event timeline.
          raw_movie="$RUNNER_TEMP/overhaul147-woodland-mix.avi"
          trap 'rm -f "$raw_movie"' EXIT
          audio_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          export VK_ICD_FILENAMES="${audio_icds[0]}"
          export LP_NUM_THREADS=4
          export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-native-audio-user"
          timeout --kill-after=5s 90s xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 30 --write-movie "$raw_movie" --script tools/woodland_audio_native.gd -- --output="$proof" 2>&1 | tee "$proof/native-audio.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/native-audio.log"; then exit 1; fi
          grep -q "WOODLAND AUDIO NATIVE: PASS" "$proof/native-audio.log"
          timeout --kill-after=5s 30s ffmpeg -v error -y -i "$raw_movie" -vn -c:a flac "$proof/mix.flac"
          test -s "$proof/mix.flac"
          timeout --foreground 60s python3 tools/check_woodland_audio_recording.py "$proof/mix.flac" "$proof/native-audio-report.json" --output "$proof/recording-check.json" 2>&1 | tee "$proof/recording-check.log"
          grep -q "WOODLAND AUDIO RECORDING: PASS" "$proof/recording-check.log"

      - name: Upload fidelity and renderer proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ACORN-HUNTER-Renderer-Proof-${{ github.sha }}
          path: ${{ runner.temp }}/renderer-checks/
          if-no-files-found: ignore
          retention-days: 14

