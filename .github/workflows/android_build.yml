name: ACORN HUNTER — Android Build

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2-stable"

jobs:
  validate-and-build:
    # Match the Ubuntu 24.04 / modern Mesa native environment used for local
    # framebuffer validation. Mesa 23 on 22.04 takes tens of seconds per draw.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python for native image comparison
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Prepare reviewed intro and park manga videos
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            intro_apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=30)
            # Hosted runners may route through mirror+file lists as well as sources.
            # Replace the slow Azure endpoint in both forms.
            for intro_apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt*mirrors*.txt; do
              if [ -f "$intro_apt_source" ]; then
                sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$intro_apt_source"
              fi
            done
            echo "Updating package index (bounded network and lock waits)"
            timeout --kill-after=10s 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get "${intro_apt_options[@]}" update -qq
            echo "Installing FFmpeg"
            timeout --kill-after=10s 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get "${intro_apt_options[@]}" install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          echo "Converting and validating four reviewed intro clips"
          python3 tools/prepare_intro_videos.py
          python3 tools/prepare_park_escape_video.py

      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Verify156 hardware graphics selection, persistence and adaptive windows
        timeout-minutes: 3
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/graphics156/policy"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/graphics156-policy-user"
          timeout --kill-after=5s 120s godot --headless --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/graphics_policy156_test.gd -- --output="$proof" 2>&1 | tee "$proof/test.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
          grep -Fq 'GRAPHICS POLICY156: PASS' "$proof/test.log"

      - name: Verify151 full campaign loading and ending handoff
        timeout-minutes: 4
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/campaign151/headless/full-flow"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/campaign151-full-flow-user"
          timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/full_game_flow_smoke_test.gd 2>&1 | tee "$proof/test.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
          grep -q "FULL GAME FLOW SMOKE TEST: PASS" "$proof/test.log"

      - name: Verify151 garden world contracts
        timeout-minutes: 4
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/campaign151/headless/garden-world"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/campaign151-garden-world-user"
          timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/botanical_world151_test.gd -- --output="$proof" 2>&1 | tee "$proof/test.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
          grep -q "BOTANICAL WORLD151: PASS" "$proof/test.log"

      - name: Verify151 guardian access contracts
        timeout-minutes: 4
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/campaign151/headless/guardian-access"
          mkdir -p "$proof"
