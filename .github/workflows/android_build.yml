    - name: Verify154 actual first vehicle frame and slow close-rival visibility
      timeout-minutes: 10
      run: |
        set -euo pipefail
        export LP_NUM_THREADS=2
        for contract in first-frame slow-rivals; do
          proof="$RUNNER_TEMP/renderer-checks/vehicles154/$contract"
