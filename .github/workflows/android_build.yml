            timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script "$script" -- --output="$proof" 2>&1 | tee "$proof/test.log"
            if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
            grep -Fq "$marker" "$proof/test.log"
          done

      - name: Verify154 fresh guardian anatomy and readable attack phases
        timeout-minutes: 4
        run: |
          set -euo pipefail
