          timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/pixel_interface151_test.gd -- --output="$proof" 2>&1 | tee "$proof/test.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
          grep -q "PIXEL INTERFACE151: PASS" "$proof/test.log"

      - name: Verify151 context loading contracts
        timeout-minutes: 4
        run: |
          set -euo pipefail
