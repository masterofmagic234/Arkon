      - name: Export optimized release Android APK with the stable test identity
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/AcornHunter-MoonlightSprint.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ACORN-HUNTER-${{ github.sha }}-Android
          path: build/AcornHunter-MoonlightSprint.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload renderer comparison images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ACORN-HUNTER-Compatibility-Visual-${{ github.sha }}
          path: ${{ runner.temp }}/renderer-checks/
          if-no-files-found: ignore
          retention-days: 14

  renderer-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python for native image comparison
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false
      - name: Prepare reviewed intro and park manga videos
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            intro_apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=30)
            # Hosted runners may route through mirror+file lists as well as sources.
            # Replace the slow Azure endpoint in both forms.
            for intro_apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt*mirrors*.txt; do
              if [ -f "$intro_apt_source" ]; then
                sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$intro_apt_source"
              fi
            done
            echo "Updating package index (bounded network and lock waits)"
            timeout --kill-after=10s 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get "${intro_apt_options[@]}" update -qq
            echo "Installing FFmpeg"
            timeout --kill-after=10s 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get "${intro_apt_options[@]}" install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          echo "Converting and validating four reviewed intro clips"
          python3 tools/prepare_intro_videos.py
          python3 tools/prepare_park_escape_video.py

      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Install native graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libvulkan1 mesa-vulkan-drivers
      - name: Verify156 actual Compatibility internal resolution and native 2D sharpness
        timeout-minutes: 3
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/graphics156/render-scale"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/graphics156-render-scale-user"
          export LP_NUM_THREADS=2
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout --kill-after=5s 120s xvfb-run -a -s "-screen 0 3000x1600x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/graphics_render_scale156_test.gd -- --output="$proof" 2>&1 | tee "$proof/test.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
          grep -Fq 'GRAPHICS RENDER SCALE156: PASS' "$proof/test.log"

      - name: Verify156 garden profiles, workload, collisions and diagnostic restoration
        timeout-minutes: 5
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/graphics156/garden"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/graphics156-garden-user"
          export LP_NUM_THREADS=2
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout --kill-after=5s 240s xvfb-run -a -s "-screen 0 3000x1600x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/botanical_graphics156_test.gd -- --output="$proof" 2>&1 | tee "$proof/test.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/test.log"; then exit 1; fi
          grep -Fq 'BOTANICAL GRAPHICS156: PASS' "$proof/test.log"

      - name: Verify the exact 1.47 reference rendering and restoration contracts
        timeout-minutes: 4
        run: |
          set -euo pipefail
          perf_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          export VK_ICD_FILENAMES="${perf_icds[0]}"
          export LP_NUM_THREADS=4
          export XDG_DATA_HOME="$RUNNER_TEMP/optimization148-native-contract-user"
          proof="$RUNNER_TEMP/renderer-checks/optimization148/reference-contract"
          mkdir -p "$proof"
          timeout --kill-after=5s 180s xvfb-run -a -s "-screen 0 1600x1000x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/botanical_rendering_test.gd 2>&1 | tee "$proof/rendering147.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/rendering147.log"; then exit 1; fi
          grep -q "BOTANICAL RENDERING: PASS" "$proof/rendering147.log"

      - name: Verify production foliage LOD geometry and immutable instance buffers
        timeout-minutes: 4
        run: |
          set -euo pipefail
