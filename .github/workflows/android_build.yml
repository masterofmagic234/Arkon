          export LP_NUM_THREADS=4
          export XDG_DATA_HOME="$RUNNER_TEMP/optimization148-native-probe-user"
          proof="$RUNNER_TEMP/renderer-checks/performance/probe"
          mkdir -p "$proof"
          timeout --kill-after=5s 300s xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tools/botanical_probe_test.gd -- --native-run --output="$proof" 2>&1 | tee "$proof/native-probe.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/native-probe.log"; then exit 1; fi
          grep -q "BOTANICAL PROBE: PASS" "$proof/native-probe.log"

      - name: Compare the current garden across Forward+ and Compatibility
        timeout-minutes: 9
        run: |
          set -o pipefail
          timeout --kill-after=5s 240s xvfb-run -a -s "-screen 0 1600x1000x24" godot --path . --rendering-method forward_plus --rendering-driver vulkan --audio-driver Dummy --script tools/botanical_renderer_capture.gd -- --expect-renderer=forward_plus --output="$RUNNER_TEMP/renderer-checks/renderer/reference" 2>&1 | tee botanical-forward-reference.log
          timeout --kill-after=5s 240s xvfb-run -a -s "-screen 0 1600x1000x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tools/botanical_renderer_capture.gd -- --expect-renderer=gl_compatibility --output="$RUNNER_TEMP/renderer-checks/renderer/compatibility" 2>&1 | tee botanical-compatibility.log
          for renderer_log in botanical-forward-reference.log botanical-compatibility.log; do
            if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$renderer_log"; then exit 1; fi
            grep -q 'BOTANICAL RENDERER CAPTURE: PASS' "$renderer_log"
          done
          python3 tools/compare_botanical_renderers.py "$RUNNER_TEMP/renderer-checks/renderer/reference" "$RUNNER_TEMP/renderer-checks/renderer/compatibility"

