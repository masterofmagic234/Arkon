          mkdir -p "$audio_proof"
          timeout --foreground 60s python3 tools/guardian153_assets_test.py --output "$audio_proof/report.json" 2>&1 | tee "$audio_proof/test.log"
          grep -Fq 'GUARDIAN153 ASSETS: PASS' "$audio_proof/test.log"
          for contract in world guardian vehicle readability presentation neon; do
            proof="$RUNNER_TEMP/renderer-checks/campaign153/headless/$contract"
            mkdir -p "$proof"
            export XDG_DATA_HOME="$RUNNER_TEMP/campaign153-$contract-user"
            case "$contract" in
