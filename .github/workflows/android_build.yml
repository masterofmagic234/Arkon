name: ACORN HUNTER — Android Build

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2-stable"

jobs:
  validate-and-build:
    # Match the Ubuntu 24.04 / modern Mesa native environment used for local
    # framebuffer validation. Mesa 23 on 22.04 takes tens of seconds per draw.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python for native image comparison
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Prepare reviewed intro and park manga videos
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            intro_apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=30)
            # Hosted runners may route through mirror+file lists as well as sources.
            # Replace the slow Azure endpoint in both forms.
            for intro_apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt*mirrors*.txt; do
              if [ -f "$intro_apt_source" ]; then
                sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$intro_apt_source"
              fi
            done
            echo "Updating package index (bounded network and lock waits)"
            timeout --kill-after=10s 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get "${intro_apt_options[@]}" update -qq
            echo "Installing FFmpeg"
            timeout --kill-after=10s 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get "${intro_apt_options[@]}" install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          echo "Converting and validating four reviewed intro clips"
          python3 tools/prepare_intro_videos.py
          python3 tools/prepare_park_escape_video.py

      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Verify original pixel heroine, real gait and cone weapon grips
        timeout-minutes: 2
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/overhaul147/headless"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-hero-user"
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level3_hero_test.gd 2>&1 | tee "$proof/hero.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/hero.log"; then exit 1; fi
          grep -q "LEVEL3 HERO: PASS" "$proof/hero.log"

      - name: Verify real cone projectiles, muzzle puffs, Foley and floor pickups
        timeout-minutes: 2
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/overhaul147/headless"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-equipment-user"
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level3_cone_equipment_test.gd 2>&1 | tee "$proof/cone-equipment.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/cone-equipment.log"; then exit 1; fi
          grep -q "LEVEL3 CONE EQUIPMENT: PASS" "$proof/cone-equipment.log"

      - name: Verify swept van clearance, phone framing and ten physical stacks
        timeout-minutes: 3
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/overhaul147/headless"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-direction-user"
          timeout --foreground 120s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level3_direction_test.gd -- --output="$proof/direction" 2>&1 | tee "$proof/direction.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/direction.log"; then exit 1; fi
          grep -q "LEVEL3 DIRECTION: PASS" "$proof/direction.log"

      - name: Verify imported CEDAR geometry, supporting hand, walking and recoil
        timeout-minutes: 2
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/overhaul147/headless"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-weapon-user"
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/modern_conegun_test.gd -- --output="$proof/weapon" 2>&1 | tee "$proof/weapon.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/weapon.log"; then exit 1; fi
          grep -q "MODERN CONEGUN: PASS" "$proof/weapon.log"

      - name: Verify imported squirrel skins, all clips, floor contacts and throw sockets
        timeout-minutes: 2
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/overhaul147/headless"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-rig-user"
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/squirrel_rig_test.gd -- --output="$proof/rig" 2>&1 | tee "$proof/rig.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/rig.log"; then exit 1; fi
          grep -q "SQUIRREL RIG: PASS" "$proof/rig.log"

      - name: Verify owned garden actors, physical patrols, search and dodgeable shots
        timeout-minutes: 4
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/overhaul147/headless"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-ai-user"
          timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/botanical_guard_ai_test.gd -- --output="$proof/guard-ai" 2>&1 | tee "$proof/guard-ai.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/guard-ai.log"; then exit 1; fi
          grep -q "BOTANICAL GUARD AI: PASS" "$proof/guard-ai.log"

      - name: Verify shipped audio PCM, source pins, headroom, variation and loops
        timeout-minutes: 2
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/overhaul147/headless"
          mkdir -p "$proof"
          timeout --foreground 60s python3 tools/woodland_audio_assets_test.py --output "$proof/audio-assets.json" 2>&1 | tee "$proof/audio-assets.log"
          grep -q "WOODLAND AUDIO ASSETS: PASS" "$proof/audio-assets.log"

      - name: Verify woodland audio routing, volume, pause, voice limits and cleanup
        timeout-minutes: 2
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/renderer-checks/overhaul147/headless"
          mkdir -p "$proof"
          export XDG_DATA_HOME="$RUNNER_TEMP/overhaul147-audio-user"
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/woodland_audio_test.gd -- --output="$proof/audio" 2>&1 | tee "$proof/audio.log"
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$proof/audio.log"; then exit 1; fi
          grep -q "WOODLAND AUDIO: PASS" "$proof/audio.log"

      - name: Verify intro playback, dialogue and campaign handoff
        run: |
          set -o pipefail
          timeout --foreground 60s godot --verbose --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/intro_cinematic_test.gd 2>&1 | tee intro-cinematic.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' intro-cinematic.log; then exit 1; fi
          grep -q "INTRO CINEMATIC: PASS" intro-cinematic.log

      - name: Verify park manga captions, audio, pause and campaign handoff
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout --foreground 120s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/park_escape_cinematic_test.gd 2>&1 | tee park-escape.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' park-escape.log; then exit 1; fi
          grep -q "PARK ESCAPE CINEMATIC: PASS" park-escape.log

      - name: Verify signed oncoming traffic and physical roadblocks
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout --foreground 120s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level2_encounters_test.gd 2>&1 | tee level2_encounters_test.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' level2_encounters_test.log; then exit 1; fi
          grep -q "LEVEL2 ENCOUNTERS: PASS" level2_encounters_test.log

      - name: Verify persistent rear road and scenery under camera orbit
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout --foreground 120s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level2_rear_world_test.gd 2>&1 | tee level2_rear_world_test.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' level2_rear_world_test.log; then exit 1; fi
          grep -q "REAR WORLD: PASS" level2_rear_world_test.log

      - name: Verify pixel 240 doors and clean van assets
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level3_vehicle_art_test.gd 2>&1 | tee level3_vehicle_art_test.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' level3_vehicle_art_test.log; then exit 1; fi
          grep -q "LEVEL3 VEHICLE ART: PASS" level3_vehicle_art_test.log

      - name: Verify animated pixel dialogue and modal touch input
        timeout-minutes: 2
        run: |
          set -o pipefail
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level3_dialogue_test.gd 2>&1 | tee level3_dialogue_test.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' level3_dialogue_test.log; then exit 1; fi
          grep -q "LEVEL3 DIALOGUE: PASS" level3_dialogue_test.log

      - name: Verify physical diner arrival, breach and story lifecycle
        timeout-minutes: 4
        run: |
          set -o pipefail
          timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level3_story_test.gd 2>&1 | tee level3_story_test.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' level3_story_test.log; then exit 1; fi
          grep -q "LEVEL3 STORY: PASS" level3_story_test.log

      - name: Verify imported tank rig, reactions and default scout
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout --foreground 120s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/tank_squirrel_test.gd 2>&1 | tee tank-rig.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' tank-rig.log; then exit 1; fi
          grep -q "TANK RIG: PASS" tank-rig.log

      - name: Verify independent woodland touch controls and pause release
        run: |
          set -o pipefail
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/woodland_input_test.gd 2>&1 | tee woodland-input.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' woodland-input.log; then exit 1; fi
          grep -q "WOODLAND HUD: PASS" woodland-input.log

      - name: Verify woodland patrols, tank attacks and combat rules
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout --foreground 120s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/woodland_guard_test.gd 2>&1 | tee woodland-guards.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' woodland-guards.log; then exit 1; fi
          grep -q "WOODLAND GUARD: PASS" woodland-guards.log

      - name: Verify baked garden lighting and original-lighting restoration
        run: |
          set -o pipefail
          timeout --foreground 120s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/botanical_lighting_test.gd 2>&1 | tee botanical-lighting.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' botanical-lighting.log; then exit 1; fi
          grep -q "BOTANICAL LIGHTING: PASS" botanical-lighting.log

      - name: Verify evening garden objectives, installed parts and hydraulic gate
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout --foreground 120s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/botanical_evening_test.gd 2>&1 | tee botanical-evening.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' botanical-evening.log; then exit 1; fi
          grep -q "BOTANICAL EVENING: PASS" botanical-evening.log

      - name: Complete the entire continuous botanical garden
        run: |
          set -o pipefail
          timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/botanical_playthrough.gd 2>&1 | tee botanical_playthrough.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' botanical_playthrough.log; then exit 1; fi
          grep -q "BOTANICAL PLAYTHROUGH: PASS" botanical_playthrough.log

      - name: Complete the garden through the alternate service route and guardian fight
        run: |
          set -o pipefail
          timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/botanical_playthrough.gd -- --combat 2>&1 | tee botanical-combat.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' botanical-combat.log; then exit 1; fi
          grep -q "BOTANICAL PLAYTHROUGH: PASS" botanical-combat.log

      - name: Verify garden puzzles, checkpoints, map and rendering lifecycle
        run: |
          set -o pipefail
          timeout --foreground 180s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/botanical_rules_test.gd 2>&1 | tee botanical_rules_test.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' botanical_rules_test.log; then exit 1; fi
          grep -q "BOTANICAL RULES: PASS" botanical_rules_test.log

      - name: Verify staged phone diagnostics restore rendering and input
        run: |
          set -o pipefail
          timeout --foreground 120s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/botanical_probe_test.gd 2>&1 | tee botanical-probe.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' botanical-probe.log; then exit 1; fi
          grep -q "BOTANICAL PROBE: PASS" botanical-probe.log

      - name: Run Level 2 smoke test
        id: level2_smoke
        run: |
          set -o pipefail
          set +e
          timeout --foreground 60s godot --verbose --headless --path . --audio-driver Dummy --script tools/level2_smoke_test.gd 2>&1 | tee level2-smoke.log
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|NavigationServer navigation map query failed' level2-smoke.log; then
            echo "Level 2 smoke emitted a runtime/parser error"
            exit 1
          fi
          grep -q "LEVEL2" level2-smoke.log

      - name: Verify pursuit contacts, helicopter spikes and lifecycle
        run: |
          set -o pipefail
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level2_pursuit_test.gd 2>&1 | tee level2-pursuit.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' level2-pursuit.log; then exit 1; fi
          grep -q "LEVEL2 PURSUIT: PASS" level2-pursuit.log

      - name: Verify squirrel radio, solid bodies and overtake braking
        run: |
          set -o pipefail
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level2_radio_tactics_test.gd 2>&1 | tee level2-radio-tactics.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' level2-radio-tactics.log; then exit 1; fi
          grep -q "RADIO/TACTICS: PASS" level2-radio-tactics.log

      - name: Verify airframe inertia, thrust and moving release
        run: |
          set -o pipefail
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level2_airframe_motion_test.gd 2>&1 | tee airframe-motion.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' airframe-motion.log; then exit 1; fi
          grep -q "AIRFRAME MOTION: PASS" airframe-motion.log

      - name: Escape the live pursuit through production steering
        run: |
          set -o pipefail
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level2_playthrough.gd 2>&1 | tee level2-playthrough.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' level2-playthrough.log; then exit 1; fi
          grep -q "LEVEL2 PLAYTHROUGH: PASS" level2-playthrough.log

      - name: Verify physical race presentation and geometry
        run: |
          set -o pipefail
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/park_race_regression.gd -- --skip-level1 2>&1 | tee park-race.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' park-race.log; then exit 1; fi
          grep -q "PARK/RACE REGRESSION: PASS" park-race.log

      - name: Verify diner physics, combat and touch controls
        run: |
          set -o pipefail
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level3_smoke_test.gd 2>&1 | tee level3-smoke.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' level3-smoke.log; then exit 1; fi
          grep -q "LEVEL 3 SMOKE TEST: PASS" level3-smoke.log

      - name: Verify squirrel gait and combat animation synchronization
        run: |
          set -o pipefail
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level3_animation_test.gd 2>&1 | tee level3-animation.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' level3-animation.log; then exit 1; fi
          grep -q "LEVEL3 ANIMATION TEST: PASS" level3-animation.log

      - name: Complete the diner mission through player input
        run: |
          set -o pipefail
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/level3_playthrough.gd 2>&1 | tee level3-playthrough.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' level3-playthrough.log; then exit 1; fi
          grep -q "LEVEL 3 PLAYTHROUGH: PASS" level3-playthrough.log

      - name: Verify second-pass input, finish and combat regressions
        run: |
          set -o pipefail
          timeout --foreground 60s godot --headless --path . --audio-driver Dummy --fixed-fps 60 --script tools/second_pass_test.gd 2>&1 | tee second-pass.log
          if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Invalid (access|call|get|set)|Cannot open file|ERROR:' second-pass.log; then exit 1; fi
          grep -q "SECOND PASS: PASS" second-pass.log

      - name: Verify botanical art, renderer colors and native race depth
        timeout-minutes: 12
        run: |
          set -o pipefail
          forward_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          if ! command -v xvfb-run >/dev/null || [ ! -f "${forward_icds[0]}" ]; then
            timeout --kill-after=5s 60s sudo apt-get update
            timeout --kill-after=5s 60s sudo apt-get install -y xvfb libvulkan1 mesa-vulkan-drivers
          fi
          forward_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${forward_icds[0]}"
          export VK_ICD_FILENAMES="${forward_icds[0]}"
          export LP_NUM_THREADS=4
          timeout --kill-after=5s 90s xvfb-run -a -s "-screen 0 1600x900x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 120 --script tools/forward_plus_visual_checks.gd -- --expect-renderer=gl_compatibility --skip-level1 --output="$RUNNER_TEMP/renderer-checks/compatibility" 2>&1 | tee compatibility-visual.log
          timeout --kill-after=5s 180s xvfb-run -a -s "-screen 0 1600x900x24" godot --path . --rendering-method forward_plus --rendering-driver vulkan --audio-driver Dummy --fixed-fps 120 --script tools/forward_plus_visual_checks.gd -- --expect-renderer=forward_plus --skip-level1 --output="$RUNNER_TEMP/renderer-checks/forward" 2>&1 | tee forward-visual.log
          timeout --kill-after=5s 180s xvfb-run -a -s "-screen 0 1600x900x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 120 --script tools/race_visual_checks.gd 2>&1 | tee race-visual.log
          timeout --kill-after=5s 300s xvfb-run -a -s "-screen 0 1920x1080x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script tools/botanical_visual.gd -- --output="$RUNNER_TEMP/renderer-checks/botanical" 2>&1 | tee botanical-visual.log
          timeout --kill-after=5s 240s xvfb-run -a -s "-screen 0 3000x1600x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tools/botanical_detail_capture.gd -- --output="$RUNNER_TEMP/renderer-checks/details" 2>&1 | tee botanical-detail.log
          for forward_log in compatibility-visual.log forward-visual.log race-visual.log botanical-visual.log botanical-detail.log; do
            if grep -Eq 'SCRIPT ERROR:|Parser Error:|Parse Error:|Shader compilation failed|Invalid (access|call|get|set)|Cannot open file|ERROR:' "$forward_log"; then exit 1; fi
          done
          grep -q "FORWARD+ VISUAL: PASS" compatibility-visual.log
          grep -q "FORWARD+ VISUAL: PASS" forward-visual.log
          grep -q "RACE VISUAL: PASS" race-visual.log
          grep -q "BOTANICAL VISUAL: PASS" botanical-visual.log
          grep -q "BOTANICAL RENDERER CAPTURE: PASS" botanical-detail.log

      - name: Capture baked and original lighting in the production garden
        timeout-minutes: 9
        run: |
          set -o pipefail
          timeout --kill-after=5s 480s xvfb-run -a -s "-screen 0 1600x1000x24" godot --path . --rendering-method gl_compatibility --audio-driver Dummy --script tools/botanical_lighting_capture.gd -- --output="$RUNNER_TEMP/renderer-checks/lighting" 2>&1 | tee botanical-lighting-native.log
