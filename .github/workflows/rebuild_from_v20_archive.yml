name: Rebuild repository from V20 archive

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace repository contents with supplied V20 archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_URL="https://at.adobe.com/023j2FjBzvuhEwYm"
          TMP_ARCHIVE="$RUNNER_TEMP/acorn_hunter_v20.zip"
          TMP_EXTRACT="$RUNNER_TEMP/acorn_hunter_v20"
          curl -fL "$ARCHIVE_URL" -o "$TMP_ARCHIVE"
          test -s "$TMP_ARCHIVE"
          rm -rf "$TMP_EXTRACT"
          mkdir -p "$TMP_EXTRACT"
          unzip -q "$TMP_ARCHIVE" -d "$TMP_EXTRACT"
          PROJECT_FILE=$(find "$TMP_EXTRACT" -type f -name "project.godot" | head -n 1)
          test -n "$PROJECT_FILE"
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --delete "$PROJECT_DIR/" ./
          rm -f .github/workflows/rebuild_from_v20_archive.yml
      - name: Commit exact V20 archive contents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild repository from supplied V20 archive"
          git push origin HEAD:main
