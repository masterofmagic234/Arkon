name: One-off L3 Event Bus Refactor

on:
  push:
    branches: [refactor/l3-event-bus]
    paths:
      - "tools/refactor_l3_event_bus.py"
      - ".github/workflows/oneoff-l3-event-bus-refactor.yml"

jobs:
  refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Apply Event Bus migration
        run: python3 tools/refactor_l3_event_bus.py
      - name: Persist migration and remove one-off tooling
        run: |
          set -euxo pipefail
          rm -f tools/refactor_l3_event_bus.py .github/workflows/oneoff-l3-event-bus-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/signal_bus.gd scripts/level3_store.gd scripts/level3_player.gd scripts/level3_enemy.gd scripts/level3_pickup.gd tools/refactor_l3_event_bus.py .github/workflows/oneoff-l3-event-bus-refactor.yml
          git commit -m "Refactor Level 3 gameplay events through SignalBus"
          git push origin HEAD:refactor/l3-event-bus
