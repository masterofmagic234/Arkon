name: Rebuild V20 fixed

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore supplied archive exactly
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://at.adobe.com/023j2FjBzvuhEwYm" -o "$RUNNER_TEMP/v20.zip"
          rm -rf "$RUNNER_TEMP/v20"
          mkdir "$RUNNER_TEMP/v20"
          unzip -q "$RUNNER_TEMP/v20.zip" -d "$RUNNER_TEMP/v20"
          PROJECT_DIR=$(dirname "$(find "$RUNNER_TEMP/v20" -type f -name project.godot | head -n 1)")
          test -f "$PROJECT_DIR/project.godot"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$PROJECT_DIR/." ./
          rm -f .github/workflows/rebuild_from_v20_archive.yml .github/workflows/rebuild_v20_fixed.yml
      - name: Commit restored archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild repository from supplied V20 archive"
          git push origin HEAD:main
